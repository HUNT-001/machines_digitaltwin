<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Electrical Machines — Digital Twin Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08090c; --bar:#0c0e12; --line:#1c2029; --line2:#28303c;
    --txt:#d3d9e3; --txt2:#8791a1; --txt3:#59626f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:'Inter',system-ui,-apple-system,sans-serif;overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased;}

  #shellbar{position:fixed;top:0;left:0;right:0;height:48px;z-index:50;display:flex;align-items:center;
    justify-content:space-between;padding:0 16px;background:linear-gradient(180deg, rgba(12,14,18,0.96), rgba(12,14,18,0.82));
    border-bottom:1px solid var(--line);backdrop-filter:blur(10px);}
  .sb-brand{display:flex;align-items:center;gap:11px;min-width:190px;}
  .sb-logo{width:26px;height:26px;border-radius:7px;border:1px solid var(--line2);background:#121620;
    display:flex;align-items:center;justify-content:center;color:var(--txt2);}
  .sb-logo svg{width:15px;height:15px;}
  .sb-t1{font-weight:600;font-size:13px;letter-spacing:-0.01em;line-height:1.1;}
  .sb-t2{font-size:10.5px;color:var(--txt3);margin-top:1px;}

  .sb-switch{display:flex;gap:4px;background:rgba(0,0,0,0.25);border:1px solid var(--line);border-radius:10px;padding:4px;}
  .sb-tab{display:flex;align-items:center;gap:8px;font-family:'Inter';font-weight:500;font-size:12.5px;color:var(--txt2);
    background:transparent;border:none;padding:8px 14px;border-radius:7px;cursor:pointer;transition:all .18s;}
  .sb-tab:hover:not(.active){color:var(--txt);}
  .sb-tab.active{background:#161b24;color:var(--txt);box-shadow:inset 0 0 0 1px var(--line2);}
  .sb-dot{width:7px;height:7px;border-radius:50%;background:var(--c,#555);opacity:0.55;transition:opacity .18s, box-shadow .18s;}
  .sb-tab.active .sb-dot{opacity:1;box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent);}

  .sb-right{min-width:190px;display:flex;justify-content:flex-end;}
  .sb-tag{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--txt3);border:1px solid var(--line);
    border-radius:6px;padding:4px 9px;}

  #stage{position:fixed;top:48px;left:0;right:0;bottom:0;background:#000;}
  .exp-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#0b0e13;}
  .exp-frame.active{display:block;}

  #stageLoader{position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;
    background:var(--bg);}
  #stageLoader.show{display:flex;}
  .sl-ring{width:38px;height:38px;border-radius:50%;border:2px solid #171b22;border-top-color:#8791a1;animation:spin .9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  @media (max-width:820px){
    .sb-brand .sb-t2{display:none;} .sb-brand{min-width:44px;} .sb-right{display:none;}
    .sb-tab{padding:8px 10px;font-size:11.5px;}
  }
</style>
</head>
<body>

<div id="shellbar">
  <div class="sb-brand">
    <span class="sb-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#8791a1" stroke-width="1.5"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2" stroke-linecap="round"/></svg></span>
    <div class="sb-txt"><div class="sb-t1">Electrical Machines II</div><div class="sb-t2">Digital Twin Lab</div></div>
  </div>
  <div class="sb-switch" id="switcher">
    <button class="sb-tab active" data-exp="motor"><span class="sb-dot" style="--c:#93a158"></span>Induction motor</button>
    <button class="sb-tab" data-exp="alt"><span class="sb-dot" style="--c:#54b0a9"></span>Alternator on bus</button>
    <button class="sb-tab" data-exp="zpf"><span class="sb-dot" style="--c:#7c8cf0"></span>ZPF regulation</button>
  </div>
  <div class="sb-right"><span class="sb-tag">Static build</span></div>
</div>

<div id="stage">
  <div id="stageLoader"><div class="sl-ring"></div></div>
  <iframe class="exp-frame active" id="ifr-motor" title="Induction motor"></iframe>
  <iframe class="exp-frame" id="ifr-alt" title="Alternator on infinite bus"></iframe>
  <iframe class="exp-frame" id="ifr-zpf" title="ZPF regulation"></iframe>
</div>

<script type="text/html" id="tpl-motor"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Slip-Ring Induction Motor — Test Bench Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root{
    --bg:#100f0c; --bg-deep:#14120d;
    --panel:rgba(22,20,15,0.80); --panel2:rgba(17,15,11,0.85); --panel-hi:#221f18;
    --border:#2a271f; --border-lit:#39352a;
    --text:#e3dfd2; --text-dim:#a49d89; --text-faint:#6f6957;
    --amber:#d2a24a; --amber2:#b1853a; --amber-soft:rgba(210,162,74,0.13);
    --olive:#93a158; --olive-soft:rgba(147,161,88,0.14); --olive2:#71803f;
    --red:#cf5b45; --red-soft:rgba(207,91,69,0.14);
    --ok:#93a158; --copper:#c08a45;
    --shadow:0 10px 30px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased;}
  .mono,.gauge-read,.sl-val,.rv,.status-chip,.brand-text .t2,.view-label,.formula{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  .grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1100px 650px at 60% 4%, rgba(70,60,36,0.30), transparent 60%),
      radial-gradient(900px 900px at 50% 120%, rgba(0,0,0,0.5), transparent 55%);}
  .grid-bg::after{content:none;}

  #topbar{position:fixed;top:0;left:0;right:0;height:58px;z-index:50;display:flex;align-items:center;
    justify-content:space-between;padding:0 20px;background:linear-gradient(180deg, rgba(16,14,10,0.94), rgba(16,14,10,0.72));
    border-bottom:1px solid var(--border);backdrop-filter:blur(10px);}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:32px;height:32px;border:1px solid var(--olive2);border-radius:7px;background:var(--panel-hi);
    display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--olive);box-shadow:none;}
  .brand-text .t1{font-family:'Inter';font-weight:600;font-size:14px;letter-spacing:-0.01em;line-height:1.1;color:var(--text);text-transform:none;}
  .brand-text .t2{font-size:10.5px;color:var(--text-faint);letter-spacing:0;margin-top:2px;text-transform:none;}

  .tabs{display:flex;gap:3px;background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:9px;padding:3px;}
  .tab-btn{font-family:'Inter';font-weight:500;font-size:12.5px;letter-spacing:0;color:var(--text-dim);
    background:transparent;border:none;padding:8px 15px;border-radius:6px;cursor:pointer;transition:all .18s;text-transform:none;}
  .tab-btn.active{background:var(--panel-hi);color:var(--amber);box-shadow:none;}
  .tab-btn:hover:not(.active){color:var(--text);}

  .status-chip{font-size:11.5px;padding:7px 13px;border-radius:8px;border:1px solid var(--border);
    color:var(--text-faint);display:flex;align-items:center;gap:8px;letter-spacing:0;background:rgba(0,0,0,0.18);transition:all .25s;}
  .status-dot{width:7px;height:7px;border-radius:50%;background:#4a4636;transition:all .25s;}
  .status-chip.on{color:var(--ok);border-color:rgba(147,161,88,0.4);background:var(--olive-soft);}
  .status-chip.on .status-dot{background:var(--ok);box-shadow:0 0 0 3px rgba(147,161,88,0.14);}

  #app{position:fixed;top:58px;left:0;right:0;bottom:0;z-index:1;display:flex;}
  #viewport{flex:1;position:relative;min-width:0;}
  canvas{display:block;}
  #viewport::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 150px rgba(0,0,0,0.5);}

  .view-label{position:absolute;top:16px;left:20px;font-size:10.5px;color:var(--text-faint);letter-spacing:1px;text-transform:none;z-index:6;}
  .view-title{position:absolute;top:32px;left:20px;font-family:'Inter';font-weight:600;font-size:18px;color:var(--text);z-index:6;}

  .hint{position:absolute;bottom:14px;left:20px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-faint);
    background:rgba(16,14,10,0.72);padding:6px 11px;border-radius:7px;border:1px solid var(--border);backdrop-filter:blur(4px);z-index:6;}

  .part-label{position:absolute;transform:translate(-50%,-100%);font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--amber);
    background:rgba(16,14,10,0.9);border:1px solid var(--border-lit);padding:3px 7px;border-radius:5px;white-space:nowrap;pointer-events:none;transition:opacity .15s;}
  .part-label::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--border-lit);}

  #sidepanel{width:330px;min-width:330px;background:linear-gradient(180deg, var(--panel), var(--bg-deep));
    border-left:1px solid var(--border);overflow-y:auto;padding:18px 16px 44px;}
  #sidepanel::-webkit-scrollbar{width:8px;}
  #sidepanel::-webkit-scrollbar-thumb{background:#242019;border-radius:6px;}

  .panel-card{background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:15px 16px;margin-bottom:13px;box-shadow:0 4px 14px rgba(0,0,0,0.22);}
  .panel-card h3{margin:0 0 13px;font-family:'Inter';font-weight:600;font-size:13px;letter-spacing:-0.01em;color:var(--text);text-transform:none;display:flex;align-items:center;gap:0;}
  .panel-card h3::before{content:none;}

  .method-select{display:flex;flex-direction:column;gap:6px;}
  .method-opt{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:border-color .15s,background .15s;background:rgba(255,255,255,0.008);}
  .method-opt:hover{border-color:var(--border-lit);}
  .method-opt.active{border-color:var(--olive2);background:var(--olive-soft);}
  .method-opt .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--text-faint);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .method-opt.active .dot{border-color:var(--olive);}
  .method-opt.active .dot::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--olive);}
  .method-opt .mtxt .m1{font-family:'Inter';font-size:12.5px;font-weight:500;color:var(--text);}
  .method-opt .mtxt .m2{font-family:'Inter';font-size:11px;color:var(--text-faint);margin-top:1px;}

  .slider-row{margin-bottom:15px;}
  .slider-row:last-child{margin-bottom:0;}
  .slider-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
  .slider-label .sl-name{font-family:'Inter';font-size:12.5px;color:var(--text-dim);}
  .slider-label .sl-val{font-size:13px;color:var(--amber);font-weight:500;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;
    background:linear-gradient(90deg, var(--olive2) var(--fill,50%), #1d1a14 var(--fill,50%));outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#e6e1d3;border:1px solid #b3ab93;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,0.45);transition:transform .12s;}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18);}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#e6e1d3;border:1px solid #b3ab93;cursor:pointer;}
  input[type=range]:disabled{opacity:0.35;}

  .pole-select{display:flex;gap:6px;}
  .pole-btn{flex:1;padding:9px 0;text-align:center;border:1px solid var(--border);border-radius:7px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);cursor:pointer;background:rgba(255,255,255,0.01);transition:all .15s;}
  .pole-btn.active{border-color:var(--amber2);color:var(--amber);background:var(--amber-soft);}

  .btn-row{display:flex;gap:9px;margin-top:4px;}
  .btn{flex:1;padding:12px 0;border-radius:9px;border:1px solid var(--border-lit);cursor:pointer;font-family:'Inter';font-weight:600;font-size:13px;letter-spacing:0;text-transform:none;transition:all .15s;background:var(--panel-hi);color:var(--text-dim);}
  .btn-start{border-color:rgba(147,161,88,0.35);color:var(--ok);}
  .btn-start:hover{background:var(--olive-soft);}
  .btn-start.running{background:var(--olive-soft);color:var(--ok);border-color:var(--olive2);}
  .btn-stop{border-color:rgba(207,91,69,0.3);color:var(--red);}
  .btn-stop:hover{background:var(--red-soft);}

  .gauge-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;}
  .gauge{text-align:center;}
  .gauge svg{width:100%;height:auto;}
  .gauge-name{font-family:'Inter';font-size:10px;color:var(--text-faint);letter-spacing:0;margin-top:3px;text-transform:none;}
  .gauge-read{font-size:15px;color:var(--text);font-weight:600;margin-top:1px;}
  .gauge-unit{font-size:10px;color:var(--text-faint);font-weight:400;}

  .readout-strip{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid rgba(42,39,31,0.7);}
  .readout-strip:last-child{border-bottom:none;}
  .readout-strip .rn{font-family:'Inter';font-size:12.5px;color:var(--text-dim);}
  .readout-strip .rv{font-size:13px;color:var(--amber);font-weight:500;}

  .mini-note{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--text-faint);line-height:1.65;margin-top:9px;padding-top:9px;border-top:1px solid rgba(42,39,31,0.7);}

  #anatomy-panel .infoblock{margin-bottom:16px;}
  #anatomy-panel .infoblock h4{font-family:'Inter';font-weight:600;font-size:13px;color:var(--amber);margin:0 0 5px;letter-spacing:0;display:flex;align-items:center;gap:8px;text-transform:none;}
  #anatomy-panel .infoblock h4 .ic{width:8px;height:8px;border-radius:2px;background:var(--olive);display:inline-block;}
  #anatomy-panel .infoblock p{font-family:'Inter';font-size:12.5px;line-height:1.65;color:var(--text-dim);margin:0;}
  #anatomy-panel .infoblock .formula{font-size:11.5px;color:var(--amber);background:var(--amber-soft);border:1px solid rgba(210,162,74,0.25);padding:6px 9px;border-radius:6px;margin-top:6px;display:inline-block;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(42,39,31,0.7);}
  .toggle-row:last-child{border:none;}
  .toggle-row .tn{font-family:'Inter';font-size:12.5px;color:var(--text-dim);}
  .switch{width:40px;height:22px;border-radius:12px;background:#1d1a14;border:1px solid var(--border-lit);position:relative;cursor:pointer;flex-shrink:0;transition:all .18s;}
  .switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-faint);transition:all .18s;}
  .switch.on{background:var(--olive-soft);border-color:var(--olive2);}
  .switch.on .knob{left:20px;background:var(--olive);}

  .part-nav{display:flex;flex-wrap:wrap;gap:6px;}
  .part-chip{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--text-dim);cursor:pointer;background:rgba(255,255,255,0.01);transition:all .15s;}
  .part-chip.active{border-color:var(--olive2);color:var(--olive);background:var(--olive-soft);}

  #loading{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;transition:opacity .4s;}
  #loading .spin{width:40px;height:40px;border:2px solid #1d1a14;border-top-color:var(--amber);border-radius:50%;animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #loading .lt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-faint);letter-spacing:1px;}

  @media (max-width:900px){
    #sidepanel{position:fixed;right:0;top:58px;bottom:0;transform:translateX(100%);transition:transform .25s;box-shadow:-14px 0 40px rgba(0,0,0,0.6);}
    #sidepanel.open{transform:translateX(0);}
    #panel-toggle{display:flex !important;}
  }
  #panel-toggle{display:none;position:absolute;top:14px;right:14px;z-index:40;width:40px;height:40px;border-radius:9px;background:var(--panel-hi);border:1px solid var(--border-lit);color:var(--amber);align-items:center;justify-content:center;font-size:18px;cursor:pointer;}

</style>
</head>
<body>

<div id="loading"><div class="spin"></div><div class="lt">Initialising test bench…</div></div>

<div class="grid-bg"></div>

<div id="topbar">
  <div class="brand">
    <div class="brand-mark">3φ</div>
    <div class="brand-text">
      <div class="t1">Slip-ring induction motor</div>
      <div class="t2">Speed control & construction</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-view="bench">Test Bench</button>
    <button class="tab-btn" data-view="anatomy">Motor Anatomy</button>
  </div>
  <div class="status-chip" id="statusChip"><div class="status-dot"></div><span id="statusText">Stopped</span></div>
</div>

<div id="app">
  <div id="viewport">
    <button id="panel-toggle">☰</button>
    <div class="view-label" id="viewLabel">01 — LIVE SIMULATION</div>
    <div class="view-title" id="viewTitle">Electrical machines lab · Bay 24</div>
    <div id="labels-layer"></div>
    <div class="hint" id="viewHint">drag to orbit · scroll to zoom · right-drag to pan</div>
  </div>

  <div id="sidepanel">
    <!-- ================= BENCH PANEL ================= -->
    <div id="bench-panel">
      <div class="panel-card">
        <h3>Nameplate</h3>
        <div class="readout-strip"><span class="rn">Rated Power</span><span class="rv">5.0 HP</span></div>
        <div class="readout-strip"><span class="rn">Rated Voltage</span><span class="rv">415 V</span></div>
        <div class="readout-strip"><span class="rn">Rated Current</span><span class="rv">7.2 A</span></div>
        <div class="readout-strip"><span class="rn">Rated Speed</span><span class="rv">1400 RPM</span></div>
        <div class="readout-strip"><span class="rn">Rotor Voltage</span><span class="rv">330 V</span></div>
        <div class="readout-strip"><span class="rn">Rotor Current</span><span class="rv">6.6 A</span></div>
        <div class="readout-strip"><span class="rn">Frequency</span><span class="rv">50 Hz</span></div>
        <div class="readout-strip"><span class="rn">Make</span><span class="rv">PSG</span></div>
      </div>

      <div class="panel-card">
        <h3>Speed Control Method</h3>
        <div class="method-select" id="methodSelect">
          <div class="method-opt active" data-method="rheostat">
            <div class="dot"></div>
            <div class="mtxt"><div class="m1">Rotor Rheostat Control</div><div class="m2">external resistance in rotor circuit</div></div>
          </div>
          <div class="method-opt" data-method="pole">
            <div class="dot"></div>
            <div class="mtxt"><div class="m1">Pole Changing</div><div class="m2">2P / 4P / 6P stator rewinding</div></div>
          </div>
          <div class="method-opt" data-method="voltage">
            <div class="dot"></div>
            <div class="mtxt"><div class="m1">Stator Voltage Control</div><div class="m2">auto-transformer, V/f varied</div></div>
          </div>
        </div>
      </div>

      <div class="panel-card">
        <h3>Controls</h3>

        <div id="voltageSliderWrap" class="slider-row">
          <div class="slider-label"><span class="sl-name">Stator Voltage (auto-tf)</span><span class="sl-val" id="vVal">415 V</span></div>
          <input type="range" id="vSlider" min="60" max="415" value="415" step="1">
        </div>

        <div id="rheoSliderWrap" class="slider-row">
          <div class="slider-label"><span class="sl-name">Rotor Rheostat</span><span class="sl-val" id="rVal">0 %</span></div>
          <input type="range" id="rSlider" min="0" max="100" value="0" step="1">
        </div>

        <div id="poleSelectWrap" class="slider-row" style="display:none;">
          <div class="slider-label"><span class="sl-name">Pole Configuration</span><span class="sl-val" id="pVal">4 P</span></div>
          <div class="pole-select">
            <div class="pole-btn" data-poles="2">2 POLE</div>
            <div class="pole-btn active" data-poles="4">4 POLE</div>
            <div class="pole-btn" data-poles="6">6 POLE</div>
          </div>
        </div>

        <div class="slider-row">

          <div class="formula">s = (Ns − N) / Ns</div>
        </div>
        <div class="infoblock">

function initApp(){

/* ======================================================================
   DATA — transcribed directly from the lab notebook readings
   ====================================================================== */
const RHEO_DATA = [
  {pct:0,    rpm:1304, vr:22.0,  ir:0.70},
  {pct:14.3, rpm:1267, vr:26.0,  ir:0.70},
  {pct:28.6, rpm:1203, vr:38.6,  ir:0.75},
  {pct:42.9, rpm:1157, vr:39.8,  ir:0.75},
  {pct:57.1, rpm:1089, vr:41.3,  ir:0.73},
  {pct:71.4, rpm:980,  vr:59.8,  ir:0.70},
  {pct:85.7, rpm:806,  vr:81.6,  ir:0.65},
  {pct:100,  rpm:450,  vr:125.7, ir:0.50},
];
const POLE_DATA = {2:2994, 4:1496, 6:999};
const VOLT_DATA = [
  {v:80,  noload:1437, load25:1437},
  {v:110, noload:1482, load25:1482},
  {v:140, noload:1489, load25:1489},
  {v:170, noload:1491, load25:1491},
  {v:200, noload:1493, load25:1323},
  {v:230, noload:1494, load25:1366},
  {v:260, noload:1495, load25:1389},
  {v:290, noload:1496, load25:1410},
  {v:310, noload:1497, load25:1416},
  {v:340, noload:1499, load25:1435},
  {v:370, noload:1499, load25:1445},
  {v:400, noload:1500, load25:1455},
  {v:415, noload:1500, load25:1457},
];

function interp(table, key, x, outKey){
  if(x<=table[0][key]) return table[0][outKey];
  if(x>=table[table.length-1][key]) return table[table.length-1][outKey];
  for(let i=0;i<table.length-1;i++){
    const a=table[i], b=table[i+1];
    if(x>=a[key] && x<=b[key]){
      const t=(x-a[key])/(b[key]-a[key]);
      return a[outKey] + t*(b[outKey]-a[outKey]);
    }
  }
  return table[table.length-1][outKey];
}

/* ======================================================================
   STATE
   ====================================================================== */
const state = {
  view:'bench',
  running:false,
  method:'rheostat',
  statorVoltage:415,
  rotorPct:0,
  poles:4,
  loadPct:0,
  rpm:0, rpmDisplay:0,
  statorI:0, rotorI:0, vr:0, ns:1500, slip:0,
  shaftAngle:0,
};

/* ======================================================================
   READING COMPUTATION
   ====================================================================== */
function computeReadings(){
  let rpmBase, vr=0, rotorI=0.6, statorI=7.2;
  const ns2p=3000, ns4p=1500, ns6p=1000;

  if(state.method==='rheostat'){
    state.ns = ns4p;
    rpmBase = interp(RHEO_DATA,'pct',state.rotorPct,'rpm');
    vr = interp(RHEO_DATA,'pct',state.rotorPct,'vr');
    rotorI = interp(RHEO_DATA,'pct',state.rotorPct,'ir');
    statorI = 7.2 * (rpmBase/1304);
  } else if(state.method==='pole'){
    state.ns = state.poles===2?ns2p: state.poles===6?ns6p: ns4p;
    rpmBase = POLE_DATA[state.poles] || ns4p;
    vr = 0; rotorI = 0.6;
    statorI = 7.2 * (state.poles===2?1.15: state.poles===6?0.65:1.0);
  } else { // voltage control
    state.ns = ns4p;
    const noload = interp(VOLT_DATA,'v',state.statorVoltage,'noload');
    const load25 = interp(VOLT_DATA,'v',state.statorVoltage,'load25');
    rpmBase = noload; // load blended below via loadPct against load25 curve
    const loadedRpm = load25;
    const blend = Math.min(state.loadPct/25,1);
    rpmBase = noload + (loadedRpm-noload)*blend*(state.loadPct>0?1:0);
    vr = 0; rotorI=0.55;
    statorI = 7.2 * (state.statorVoltage/415);
  }

  // apply brake load (rope-pulley) degrade — extra drop & current rise beyond method's own load model
  const extraLoadDrop = (state.method==='voltage') ? Math.max(0,(state.loadPct-25))*0.004 : state.loadPct*0.0035;
  let rpmFinal = rpmBase * (1 - extraLoadDrop);
  const iBoost = 1 + state.loadPct*0.006;

  state.rpm = Math.max(0, rpmFinal);
  state.statorI = statorI*iBoost;
  state.rotorI = rotorI*iBoost;
  state.vr = vr;
  state.slip = (state.ns-state.rpm)/state.ns;
}

/* --- simple orbit-style camera controller (custom, no external deps) --- */
function makeOrbit(target, radius, minR, maxR){
  return {theta:0.7, phi:1.15, radius, minR, maxR, target:target.clone()};
}
let orbitBench = makeOrbit(new THREE.Vector3(0,3.4,0), 22, 8, 46);
let orbitAnatomy = makeOrbit(new THREE.Vector3(0,1.2,0), 16, 6, 36);
function currentOrbit(){ return state.view==='bench'?orbitBench:orbitAnatomy; }

function applyOrbit(o){
  const p = o.target.clone();
  p.x += o.radius*Math.sin(o.phi)*Math.sin(o.theta);
  p.y += o.radius*Math.cos(o.phi);
  p.z += o.radius*Math.sin(o.phi)*Math.cos(o.theta);
  camera.position.copy(p);
  camera.lookAt(o.target);
}
applyOrbit(orbitBench);

let dragging=false, dragBtn=0, lastX=0, lastY=0;
renderer.domElement.addEventListener('pointerdown', e=>{dragging=true; dragBtn=e.button; lastX=e.clientX; lastY=e.clientY; renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointerup', e=>{dragging=false;});
renderer.domElement.addEventListener('pointerleave', ()=>{dragging=false;});
renderer.domElement.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const o = currentOrbit();
  const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  if(dragBtn===2){
    o.target.x -= dx*0.02*Math.cos(o.theta); o.target.z += dx*0.02*Math.sin(o.theta);
    o.target.y += dy*0.02;
  } else {
    o.theta -= dx*0.006;
    o.phi = Math.min(Math.max(o.phi - dy*0.006, 0.25), Math.PI-0.25);
  }
  applyOrbit(o);
});
renderer.domElement.addEventListener('contextmenu', e=>e.preventDefault());
renderer.domElement.addEventListener('wheel', e=>{
  e.preventDefault();
  const o = currentOrbit();
  o.radius = Math.min(Math.max(o.radius + e.deltaY*0.016, o.minR), o.maxR);
  applyOrbit(o);
},{passive:false});

const __motorEnv = (function(){

/* ======================================================================
   ANALOG GAUGE SVG RENDERING
   ====================================================================== */
function buildGauge(svgId){
  const svg = document.getElementById(svgId);
  const ns='http://www.w3.org/2000/svg';
  const cx=60, cy=64, r=48;
  svg.innerHTML='';
  const arc = document.createElementNS(ns,'path');
  const startA = Math.PI*1.2, endA = Math.PI*1.8*2 - Math.PI*1.2; // placeholder, computed below properly
  // draw 210 deg arc from -105deg to +105deg (top)
  const a0=-105*Math.PI/180, a1=105*Math.PI/180;
  const x0=cx+r*Math.sin(a0), y0=cy-r*Math.cos(a0);
  const x1=cx+r*Math.sin(a1), y1=cy-r*Math.cos(a1);
  arc.setAttribute('d',`M ${x0} ${y0} A ${r} ${r} 0 1 1 ${x1} ${y1}`);
  arc.setAttribute('fill','none'); arc.setAttribute('stroke','#d9dfe7'); arc.setAttribute('stroke-width','5');
  svg.appendChild(arc);
  // tick marks
  for(let i=0;i<=10;i++){
    const a = a0 + (a1-a0)*(i/10);
    const tx0=cx+(r-6)*Math.sin(a), ty0=cy-(r-6)*Math.cos(a);
    const tx1=cx+(r+2)*Math.sin(a), ty1=cy-(r+2)*Math.cos(a);
    const tick=document.createElementNS(ns,'line');
    tick.setAttribute('x1',tx0);tick.setAttribute('y1',ty0);tick.setAttribute('x2',tx1);tick.setAttribute('y2',ty1);
    tick.setAttribute('stroke', i%5===0? '#55677c':'#b7c3d1'); tick.setAttribute('stroke-width', i%5===0?1.6:1);
    svg.appendChild(tick);
  }
  const needle = document.createElementNS(ns,'line');
  needle.setAttribute('x1',cx); needle.setAttribute('y1',cy);
  needle.setAttribute('x2',cx); needle.setAttribute('y2',cy-r+10);
  needle.setAttribute('stroke','#c1442d'); needle.setAttribute('stroke-width','2.5'); needle.setAttribute('stroke-linecap','round');
  needle.setAttribute('transform-origin',`${cx}px ${cy}px`);
  svg.appendChild(needle);
  const hub = document.createElementNS(ns,'circle');
  hub.setAttribute('cx',cx); hub.setAttribute('cy',cy); hub.setAttribute('r',4.5); hub.setAttribute('fill','#1b2734');
  svg.appendChild(hub);
  return {needle,cx,cy,a0,a1};
}
const gauges = {
  speed: buildGauge('gaugeSpeed'),
  volt: buildGauge('gaugeVolt'),
  statorI: buildGauge('gaugeStatorI'),
  rotorI: buildGauge('gaugeRotorI'),
  load: buildGauge('gaugeLoad'),
};
function setGauge(g, frac){
  frac = Math.min(Math.max(frac,0),1);
  const a = g.a0 + (g.a1-g.a0)*frac;
  const deg = a*180/Math.PI;
  g.needle.setAttribute('transform', `rotate(${deg} ${g.cx} ${g.cy})`);
}

    document.getElementById('viewLabel').textContent = state.view==='bench' ? '01 — LIVE SIMULATION' : '02 — CONSTRUCTION & WORKING PRINCIPLE';
    document.getElementById('viewTitle').textContent = state.view==='bench' ? 'Electrical Machines Lab · Bay 24' : 'Three-Phase Slip-Ring Induction Motor — Exploded View';
    document.getElementById('viewHint').textContent = state.view==='bench' ? 'drag to orbit · scroll to zoom · right-drag to pan' : 'drag to orbit · scroll to zoom · use panel to explode & inspect';

});

// method select
document.querySelectorAll('.method-opt').forEach(opt=>{

const vSlider=$('vSlider'), rSlider=$('rSlider'), lSlider=$('lSlider');

rSlider.addEventListener('input', ()=>{ state.rotorPct=+rSlider.value; $('rVal').textContent=rSlider.value+' %'; setFill(rSlider); });
lSlider.addEventListener('input', ()=>{ state.loadPct=+lSlider.value; $('lVal').textContent=lSlider.value+' %'; setFill(lSlider); });
[vSlider,rSlider,lSlider].forEach(setFill);

document.querySelectorAll('.pole-btn').forEach(btn=>{

});

$('startBtn').addEventListener('click', ()=>{

  $('startBtn').classList.add('running');
  $('statusChip').classList.add('on');

});
$('stopBtn').addEventListener('click', ()=>{

});

// anatomy controls
const explodeSlider = $('explodeSlider');
let explodeFrac = 1;
explodeSlider.addEventListener('input', ()=>{ explodeFrac = explodeSlider.value/100; $('explodeVal').textContent=explodeSlider.value+' %'; setFill(explodeSlider); });
setFill(explodeSlider);

let showSpin=true, showFlux=true, showEmf=true, showBrush=true;
function wireToggle(id, setter){
  const el = $(id);
  el.addEventListener('click', ()=>{ el.classList.toggle('on'); setter(el.classList.contains('on')); });
}
wireToggle('toggleSpin', v=>showSpin=v);
wireToggle('toggleFlux', v=>showFlux=v);
wireToggle('toggleEmf', v=>showEmf=v);
wireToggle('toggleBrush', v=>showBrush=v);

document.querySelectorAll('.part-chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    document.querySelectorAll('.part-chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    focusPart(chip.dataset.part);
  });
});
function focusPart(part){
  const map = {stator:statorGroup, rotor:rotorGroup, slip:slipGroup, brush:brushGroup, shield:shieldL, fan:fanGroup};
  const obj = map[part]; if(!obj) return;
  orbitAnatomy.theta = 0.9; orbitAnatomy.phi=1.2; orbitAnatomy.radius=9;
  applyOrbit(orbitAnatomy);
}

// mobile panel toggle
$('panel-toggle').addEventListener('click', ()=>{ document.getElementById('sidepanel').classList.toggle('open'); });

/* ======================================================================
   FLOATING LABELS
   ====================================================================== */
const labelsLayer = document.getElementById('labels-layer');
let activeLabelEls = [];
function clearLabels(){ activeLabelEls.forEach(e=>e.remove()); activeLabelEls=[]; }
function buildLabelSet(defs, group){
  clearLabels();
  defs.forEach(d=>{
    const el = document.createElement('div');
    el.className='part-label'; el.textContent=d.text;
    labelsLayer.appendChild(el);
    activeLabelEls.push(el);
    d.el = el;
  });
  return defs;
}
let benchLabelDefs = buildLabelSet(benchLabels);
function updateLabels(defs, group){
  const vw=viewport.clientWidth, vh=viewport.clientHeight;
  defs.forEach(d=>{
    const wp = new THREE.Vector3();
    d.obj.getWorldPosition(wp);
    wp.y += 1.6;
    if(group) wp.applyMatrix4(group.matrixWorld);
    const p = wp.clone().project(camera);
    if(p.z>1){ d.el.style.opacity=0; return; }
    const x=(p.x*0.5+0.5)*vw, y=(1-(p.y*0.5+0.5))*vh;
    d.el.style.left=x+'px'; d.el.style.top=y+'px';
    d.el.style.opacity = (state.view==='bench')?1:0;
  });
}

/* ======================================================================
   ANIMATION LOOP
   ====================================================================== */
let clock = new THREE.Clock();
let rpmSmoothed = 0;

function updateBenchVisuals(dt){
  computeReadings();
  const targetRpm = state.running ? state.rpm : 0;
  rpmSmoothed += (targetRpm-rpmSmoothed)*Math.min(1,dt*1.5);
  state.rpmDisplay = rpmSmoothed;

  // visible, readable spin rate: scales with actual RPM but capped so it never blurs into a smear
  const visSpeed = Math.min((rpmSmoothed/1400)*7.2, 9);
  state.shaftAngle += visSpeed*dt;
  shaftGroup.rotation.x = state.shaftAngle;
  pulley.rotation.x = state.shaftAngle;
  fanBlades.rotation.x = state.shaftAngle*1.4;

  // spring balance needle deflect with load
  dials.forEach((d,i)=>{
    const target = (state.loadPct/100)*0.9*(i===0?1:0.7);
    d.userData.needle.rotation.z += ((-target)-d.userData.needle.rotation.z)*0.1;
  });

  // brake rope visibly tightens & glows hot against the drum as load increases
  const loadFrac = state.loadPct/100;
  const ropeScale = 1 - loadFrac*0.06;
  rope.scale.set(1, ropeScale, ropeScale);
  ropeMat.color.lerpColors(new THREE.Color(0x1c1c1c), new THREE.Color(0xff6a4a), loadFrac*0.85);
  const sparkTarget = (state.running && loadFrac>0.05) ? (0.4+loadFrac*1.6)*(0.85+0.15*Math.sin(performance.now()/60)) : 0;
  frictionSpark.intensity += (sparkTarget-frictionSpark.intensity)*0.2;

  // auto-tf dial rotates with voltage
  autoTf.userData.dial.rotation.y += ((state.statorVoltage-60)/355*Math.PI*1.4 - autoTf.userData.dial.rotation.y)*0.08;

  // rheostat glow: more resistance => dimmer/hotter tint via emissive-ish scale trick using color lighten (approx by scale wobble)
  rheoUnits.forEach((u,i)=>{
    const active = (state.method==='rheostat') && (state.rotorPct > i*20);
    u.scale.setScalar(active && state.running ? 1.0+Math.sin(performance.now()/300+i)*0.01 : 1.0);
  });

  // meter needles
  const specs = {
    v: state.method==='voltage'? state.statorVoltage/415 : state.statorVoltage/415,
    a1: state.statorI/10,
    a2: state.rotorI/1.0,
    rpm: rpmSmoothed/3000,
  };
  meterMeshes.forEach(m=>{
    const t = state.running? (specs[m.tag]||0):0;
    const targetRot = -0.15 + Math.min(Math.max(t,0),1)*1.7 -0.85;
    m.needle.rotation.z += (targetRot - m.needle.rotation.z)*0.15;
  });

  // side gauges
  setGauge(gauges.speed, state.running? rpmSmoothed/3050:0);
  setGauge(gauges.volt, state.running? state.statorVoltage/430:0);
  setGauge(gauges.statorI, state.running? state.statorI/12:0);
  setGauge(gauges.rotorI, state.running? state.rotorI/1.0:0);
  setGauge(gauges.load, state.loadPct/100);

  $('rpmRead').textContent = Math.round(rpmSmoothed);
  $('voltRead').textContent = state.running? Math.round(state.statorVoltage):0;
  $('statorIRead').textContent = (state.running? state.statorI:0).toFixed(1);
  $('rotorIRead').textContent = (state.running? state.rotorI:0).toFixed(2);
  $('loadRead').textContent = state.loadPct;
  $('nsRead').textContent = state.ns+' RPM';
  $('slipRead').textContent = state.running? state.slip.toFixed(3):'—';
  $('vrRead').textContent = Math.round(state.method==='rheostat'&&state.running? state.vr:0)+' V';
  $('torqueRead').textContent = state.loadPct+' %';

  updateLabels(benchLabelDefs);
}

function updateAnatomyVisuals(dt){
  Object.values(explodeGroups).forEach(g=>{
    const off=g.userData.explodeAxial||0;
    g.position.set(g.userData.restPos.x, g.userData.restPos.y, g.userData.restPos.z + off*3.2*explodeFrac);
  });

  const spin = showSpin ? dt*10 : 0;
  if(spin){
    rotorGroup.rotation.z += spin*0.4;
    slipGroup.rotation.z += spin*0.4;
    fanGroup.rotation.z += spin*0.4;
  }

  fluxGroup.visible = showFlux;
  if(showFlux){
    const t = performance.now()/1000;
    fluxArrows.forEach((f,i)=>{
      const ang = f.baseAng + t*2.2;
      f.arrow.position.set(Math.cos(ang)*1.55, Math.sin(ang)*1.55, 0);
      const dir = new THREE.Vector3(Math.cos(ang+Math.PI/2), Math.sin(ang+Math.PI/2),0);
      f.arrow.setDirection(dir);
      const hue = (i/8);
      f.arrow.setColor(new THREE.Color().setHSL(0.11,0.85,0.55+0.15*Math.sin(t*3+i)));
    });
  }

  emfGroup.visible = showEmf;
  if(showEmf){
    const t=performance.now()/1000;
    emfRings.forEach((r,i)=>{
      r.material.opacity = 0.25+0.35*Math.abs(Math.sin(t*3-i*0.5));
      r.rotation.z = t*1.5;
    });
  }

  sparkGroup.visible = showBrush;
  if(showBrush){
    const t=performance.now()/1000;
    sparkGroup.children.forEach((s,i)=>{
      s.intensity = showSpin ? (0.4+0.4*Math.abs(Math.sin(t*8+i*2))) : 0.15;
    });
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(state.view==='bench'){
    updateBenchVisuals(dt);
    renderer.render(sceneBench, camera);
  } else {
    updateAnatomyVisuals(dt);
    renderer.render(sceneAnatomy, camera);
  }
}
animate();

document.getElementById('loading').style.opacity='0';
setTimeout(()=>document.getElementById('loading').remove(),450);

} // initApp
<\/script>

  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#e2e8f0;border:1px solid #aab6c6;cursor:pointer;transition:transform .12s;
    box-shadow:0 1px 4px rgba(0,0,0,0.4);}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18);}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#e2e8f0;border:1px solid #aab6c6;cursor:pointer;}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;}
  .toggle-row .tn{font-size:12.5px;color:var(--txt-2);}
  .toggle-row .tn .sub{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--txt-3);margin-top:2px;}
  .switch{width:40px;height:22px;border-radius:12px;background:#1a222d;border:1px solid var(--line-2);
    position:relative;cursor:pointer;flex-shrink:0;transition:background .18s, border-color .18s;}
  .switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:#8896a8;transition:left .18s, background .18s;}
  .switch.on{background:var(--teal-soft);border-color:var(--teal-2);}
  .switch.on .knob{left:20px;background:var(--teal);}
  .switch.warn{background:var(--amber-soft);border-color:var(--amber-2);}
  .switch.warn .knob{background:var(--amber);}

  .checklist{display:flex;flex-direction:column;gap:2px;}
  .check{display:flex;align-items:center;gap:11px;padding:7px 0;font-size:12.5px;color:var(--txt-2);
    border-bottom:1px solid rgba(34,43,55,0.45);}
  .check:last-child{border-bottom:none;}
  .check .mk{width:17px;height:17px;border-radius:5px;border:1px solid var(--line-2);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--txt-3);
    background:rgba(0,0,0,0.2);transition:border-color .2s, color .2s, background .2s;}
  .check.ok{color:var(--txt);}
  .check.ok .mk{border-color:var(--teal-2);color:var(--teal);background:var(--teal-soft);}
  .check.no .mk{border-color:var(--amber-2);color:var(--amber);background:var(--amber-soft);}
  .check .val{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--txt-3);}

  .btn{width:100%;padding:13px 0;border-radius:9px;border:1px solid var(--line-2);cursor:pointer;
    font-family:'Inter';font-weight:600;font-size:13.5px;color:var(--txt-2);
    transition:border-color .15s, background .15s, color .15s;background:var(--surface-hi);}
  .btn:hover{border-color:#354154;color:var(--txt);}
  .btn.primary.armed{border-color:var(--amber-2);background:var(--amber-soft);color:var(--amber);}
  .btn.danger{border-color:rgba(213,96,79,0.3);color:var(--fault);}
  .btn.danger:hover{background:var(--fault-soft);border-color:rgba(213,96,79,0.5);}

  .note{font-size:11.5px;color:var(--txt-3);line-height:1.65;margin-top:12px;padding-top:12px;
    border-top:1px solid rgba(34,43,55,0.6);}
  .note em{color:var(--txt-2);font-style:normal;}
  .k{color:var(--teal);}

  /* loading */
  #loading{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;transition:opacity .5s;}
  .load-ring{width:38px;height:38px;border-radius:50%;border:2px solid #1a222d;border-top-color:var(--teal);
    animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  #loading .lt2{font-size:15px;font-weight:600;color:var(--txt);}
  #loading .lt{font-size:12px;color:var(--txt-3);}

  .flash-trip{animation:tripflash .45s 3;}
  @keyframes tripflash{50%{background:var(--fault-soft);}}

  #ptoggle{display:none;position:absolute;top:14px;right:14px;z-index:40;width:40px;height:40px;border-radius:9px;
    background:var(--surface-solid);border:1px solid var(--line-2);color:var(--txt);align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
  @media (max-width:960px){
    #side{position:fixed;right:0;top:58px;bottom:0;transform:translateX(100%);transition:transform .25s;box-shadow:-14px 0 40px rgba(0,0,0,0.55);}
    #side.open{transform:translateX(0);}
    #ptoggle{display:flex;}
    #cluster{width:250px;transform:scale(.92);transform-origin:top left;}
  }
</style>
</head>
<body>

<div id="loading">
  <div class="load-ring"></div>
  <div class="lt2">Alternator on Infinite Bus</div>
  <div class="lt">Initialising machine model…</div>
</div>

<div class="backdrop"></div>

<div id="topbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#54b0a9" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><path d="M12 4v5" stroke-linecap="round"/></svg>
    </div>
    <div class="brand-text">
      <div class="t1">Alternator on Infinite Bus</div>
      <div class="t2">Synchronising &amp; loading panel</div>
    </div>
  </div>
  <div class="topbar-mid">

  </div>
</div>

<div id="app">
  <div id="viewport">
    <canvas id="three"></canvas>
    <div class="stage-fade"></div>
    <button id="ptoggle">☰</button>

    <div id="cluster">
      <div class="cluster-head">
        <span class="ttl">Synchronising instruments</span>

      </div>
      <div class="cluster-body">
        <div class="instr-row">
          <div id="synchroscope">
            <svg viewBox="0 0 132 132">
              <circle class="sc-face" cx="66" cy="66" r="58"/>
              <g id="scTicks"></g>
              <path id="scRefMark" d="M66 9 l4 7 l-8 0 z"/>
              <text class="sc-lbl" x="66" y="26" text-anchor="middle">In phase</text>
              <text class="sc-lbl" x="17" y="70">Slow</text>
              <text class="sc-lbl" x="103" y="70" text-anchor="end">Fast</text>
              <line id="scPointer" x1="66" y1="66" x2="66" y2="18"/>
              <circle cx="66" cy="66" r="4" fill="#151b24" stroke="#2a3543" stroke-width="1.4"/>
              <text id="scReadout" x="66" y="104">Δf 0.00 Hz</text>
              <text id="scState" x="66" y="117">drifting</text>
            </svg>
          </div>
          <div class="lamp-stack">
            <div class="lamp-line"><div class="lamp" id="l0"><div class="fila"></div></div><div class="lamp-tag">L1<span class="mono"> R</span></div></div>
            <div class="lamp-line"><div class="lamp" id="l1"><div class="fila"></div></div><div class="lamp-tag">L2<span class="mono"> Y</span></div></div>
            <div class="lamp-line"><div class="lamp" id="l2"><div class="fila"></div></div><div class="lamp-tag">L3<span class="mono"> B</span></div></div>
          </div>
        </div>

        <div class="scope-wrap">
          <div class="scope-head">
            <span class="lbl">Waveform comparison</span>
            <span class="rd" id="scopePhase">Δθ 0°</span>
          </div>
          <canvas id="scopeCv" width="520" height="192"></canvas>
          <div class="scope-legend">
            <span><i class="lg-dash" style="background:var(--bus)"></i>Infinite bus</span>
            <span><i class="lg-dash" style="background:var(--amber)"></i>Alternator</span>
          </div>
        </div>
      </div>
    </div>

    <div class="view-hint" id="viewHint">Drag to orbit · scroll to zoom · right-drag to pan</div>
    <button id="hintDot" title="Camera controls"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="8" y="3.5" width="8" height="17" rx="4"/><path d="M12 7v3.5" stroke-linecap="round"/></svg></button>
  </div>

  <!-- ================= SIDE PANEL ================= -->
  <div id="side">

    <!-- BEFORE SYNC -->
    <div id="pane-sync">
      <div class="card">
        <h3>Infinite bus</h3>
        <div class="row"><span class="rn">Bus voltage</span><span class="rv bus">415 V</span></div>
        <div class="row"><span class="rn">Bus frequency</span><span class="rv bus">50.00 Hz</span></div>
        <div class="row"><span class="rn">Phase sequence</span><span class="rv bus">R · Y · B</span></div>
        <div class="note">The grid is an <span class="k">infinite bus</span> — its voltage and frequency hold constant. The incoming alternator is matched <em>to it</em>.</div>
      </div>

      <div class="card">
        <h3>Synchronising method</h3>
        <div class="seg" id="methodSeg">
          <div class="seg-opt active" data-m="dark3"><div class="radio"></div><div><div class="m1">Three dark lamps</div><div class="m2">all three extinguish together at sync</div></div></div>
          <div class="seg-opt" data-m="bright2"><div class="radio"></div><div><div class="m1">Two bright, one dark</div><div class="m2">dark lamp rotates — indicates fast / slow</div></div></div>
          <div class="seg-opt" data-m="scope"><div class="radio"></div><div><div class="m1">Synchroscope</div><div class="m2">pointer to top, creeping slowly</div></div></div>
        </div>
      </div>

      <div class="card">
        <h3>Incoming alternator</h3>
        <div class="field">
          <div class="field-top"><span class="fn">Prime-mover speed → f<sub>alt</sub></span><span class="fv" id="fVal">50.00 Hz</span></div>
          <input type="range" id="fSlider" min="48" max="52" value="50" step="0.01">
        </div>
        <div class="field">
          <div class="field-top"><span class="fn">Field excitation → V<sub>alt</sub></span><span class="fv" id="eVal">415 V</span></div>
          <input type="range" id="eSlider" min="380" max="450" value="415" step="1">
        </div>
        <div class="toggle-row">
          <div class="tn">Phase sequence<span class="sub" id="seqTxt">R · Y · B — matched</span></div>
          <div class="switch on" id="seqSwitch"><div class="knob"></div></div>
        </div>
      </div>

      <div class="card">
        <h3>Synchronising conditions</h3>
        <div class="checklist" id="condList">
          <div class="check" data-c="v"><div class="mk">–</div>Voltage match<span class="val" id="cVd"></span></div>
          <div class="check" data-c="f"><div class="mk">–</div>Frequency match<span class="val" id="cFd"></span></div>
          <div class="check" data-c="p"><div class="mk">–</div>Phase coincidence<span class="val" id="cPd"></span></div>
          <div class="check" data-c="s"><div class="mk">–</div>Phase sequence correct</div>
        </div>
        <button class="btn primary" id="closeBtn" style="margin-top:15px;">Close breaker</button>
        <div class="note">Close only when all four conditions are satisfied. Closing out of sync produces a heavy transient and trips the breaker.</div>
      </div>
    </div>

    <!-- AFTER SYNC -->
    <div id="pane-load" style="display:none;">
      <div class="card">
        <h3>On the bus</h3>
        <div class="row"><span class="rn">Machine speed</span><span class="rv accent" id="ldSpeed">1500 RPM</span></div>
        <div class="row"><span class="rn">Locked to bus</span><span class="rv bus">50.00 Hz</span></div>
        <div class="note">Once paralleled, speed is <span class="k">held by the grid</span>. Throttle now sets <em>real power</em> delivered; excitation sets <em>reactive power</em>.</div>
      </div>

      <div class="card">
        <h3>Governor / throttle</h3>
        <div class="field">
          <div class="field-top"><span class="fn">Mechanical power input</span><span class="fv" id="thVal">0 %</span></div>
          <input type="range" id="thSlider" min="0" max="100" value="0" step="1">
        </div>
        <div class="row"><span class="rn">Real power P → grid</span><span class="rv accent" id="pOut">0.00 kW</span></div>
        <div class="row"><span class="rn">Load angle δ</span><span class="rv" id="deltaOut">0.0°</span></div>
      </div>

      <div class="card">
        <h3>Excitation</h3>
        <div class="field">
          <div class="field-top"><span class="fn">Field excitation → V<sub>alt</sub></span><span class="fv" id="e2Val">415 V</span></div>
          <input type="range" id="e2Slider" min="380" max="450" value="415" step="1">
        </div>
        <div class="row"><span class="rn">Reactive power Q</span><span class="rv" id="qOut">0.0 kVAR</span></div>
        <div class="row"><span class="rn">Excitation state</span><span class="rv" id="exState">Normal</span></div>
      </div>

      <div class="card">
        <h3>Machine readings</h3>
        <div class="row"><span class="rn">Armature current I<sub>a</sub></span><span class="rv" id="iaOut">0.0 A</span></div>
        <div class="row"><span class="rn">Apparent power S</span><span class="rv" id="sOut">0.0 kVA</span></div>
        <div class="row"><span class="rn">Power factor</span><span class="rv" id="pfOut">1.00</span></div>
        <button class="btn danger" id="openBtn" style="margin-top:15px;">Open breaker · off bus</button>
      </div>
    </div>

  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
<script>
window.addEventListener('load', () => {
  try { boot(); }
  catch(e){
    document.getElementById('loading').innerHTML =
      '<div style="color:#d5604f;font-family:Inter;font-size:13px;max-width:420px;text-align:center;line-height:1.6;">3D engine failed to start:<br>'+e.message+'</div>';
    console.error(e);
  }
});

function boot(){
  const DEG = Math.PI/180;
  const $ = id => document.getElementById(id);
  const clamp = (v,a,b)=>Math.min(Math.max(v,a),b);

  /* ---------------- state ---------------- */
  const BUS = { V:415, f:50.00 };
  const S = {
    method:'dark3', seqCorrect:true,
    fAlt:50.00, exc:415,
    onBus:false, trip:false, tripTimer:0,
    phi:0, throttle:0, excLoad:415,
    delta:0, P:0, Q:0, Ia:0, Sapp:0, pf:1,
    shaftAngle:0, breaker:0, scopeT:0,
  };
  const wrapPi = a => { a=(a+Math.PI)%(2*Math.PI); if(a<0)a+=2*Math.PI; return a-Math.PI; };

  /* ---------------- physics ---------------- */
  function condStates(){
    const df = S.fAlt - BUS.f, dv = S.exc - BUS.V;
    return {
      df, dv,
      vOk: Math.abs(dv) <= 6,
      fOk: Math.abs(df) <= 0.20,
      pOk: Math.cos(S.phi) > Math.cos(8*DEG),
      sOk: S.seqCorrect,
      ready(){ return this.vOk && this.fOk && this.pOk && this.sOk; }
    };
  }
  function lampBrightness(angle){
    const Va=S.exc, Vb=BUS.V;
    const d2 = Va*Va + Vb*Vb - 2*Va*Vb*Math.cos(angle);
    return clamp(d2/((Va+Vb)*(Va+Vb)) * 1.7, 0, 1);
  }
  function lampOffsets(){
    if(S.method==='scope') return [0,0,0];
    if(S.method==='dark3') return S.seqCorrect ? [0,0,0] : [0,120*DEG,240*DEG];
    return S.seqCorrect ? [0,120*DEG,240*DEG] : [0,240*DEG,120*DEG];
  }
  function computeLoad(){
    S.delta = (S.throttle/100) * 48*DEG;
    S.P = 6.0 * Math.sin(S.delta);
    S.Q = 0.075 * (S.excLoad - BUS.V);
    S.Sapp = Math.hypot(S.P, S.Q);
    S.Ia = S.Sapp>1e-4 ? (S.Sapp*1000)/(Math.sqrt(3)*BUS.V) : 0;
    S.pf = S.Sapp>1e-4 ? S.P/S.Sapp : 1;
  }

  /* ================= THREE.JS ================= */
  const canvas = $('three'), viewport = $('viewport');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(viewport.clientWidth, viewport.clientHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0e13);
  scene.fog = new THREE.FogExp2(0x0b0e13, 0.020);

  const camera = new THREE.PerspectiveCamera(40, viewport.clientWidth/viewport.clientHeight, 0.1, 400);

  /* -------- procedural studio environment for PBR reflections -------- */
  function buildEnv(){
    const c=document.createElement('canvas'); c.width=1024; c.height=512;
    const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,0,512);
    g.addColorStop(0.00,'#252c36'); g.addColorStop(0.46,'#12171e');
    g.addColorStop(0.54,'#0d1218'); g.addColorStop(1.00,'#06080c');
    x.fillStyle=g; x.fillRect(0,0,1024,512);
    function soft(cx,cy,r,a){ const rg=x.createRadialGradient(cx,cy,0,cx,cy,r);
      rg.addColorStop(0,'rgba(205,220,235,'+a+')'); rg.addColorStop(1,'rgba(205,220,235,0)');
      x.fillStyle=rg; x.fillRect(cx-r,cy-r,r*2,r*2); }
    soft(250,150,150,0.55); soft(720,120,120,0.30); soft(520,360,260,0.10);
    const tex=new THREE.CanvasTexture(c); tex.mapping=THREE.EquirectangularReflectionMapping;
    try{
      const pmrem=new THREE.PMREMGenerator(renderer); pmrem.compileEquirectangularShader();
      const rt=pmrem.fromEquirectangular(tex); tex.dispose(); pmrem.dispose();
      return rt.texture;
    }catch(e){ return tex; }
  }
  scene.environment = buildEnv();

  // orbit
  const orbit = { theta:0.86, phi:1.16, radius:23, minR:12, maxR:48, target:new THREE.Vector3(0.6,2.6,0) };
  function applyOrbit(){
    const o=orbit, p=o.target.clone();
    p.x += o.radius*Math.sin(o.phi)*Math.sin(o.theta);
    p.y += o.radius*Math.cos(o.phi);
    p.z += o.radius*Math.sin(o.phi)*Math.cos(o.theta);
    camera.position.copy(p); camera.lookAt(o.target);
  }
  applyOrbit();
  let drag=false, mbtn=0, lx=0, ly=0;
  canvas.addEventListener('pointerdown', e=>{drag=true;mbtn=e.button;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointerup', ()=>drag=false);
  canvas.addEventListener('pointerleave', ()=>drag=false);
  canvas.addEventListener('pointermove', e=>{
    if(!drag)return;
    const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    if(mbtn===2){ orbit.target.x -= dx*0.018*Math.cos(orbit.theta); orbit.target.z += dx*0.018*Math.sin(orbit.theta); orbit.target.y += dy*0.018; }
    else { orbit.theta -= dx*0.006; orbit.phi = clamp(orbit.phi - dy*0.006, 0.28, Math.PI-0.34); }
    applyOrbit();
  });
  canvas.addEventListener('contextmenu', e=>e.preventDefault());
  canvas.addEventListener('wheel', e=>{ e.preventDefault(); orbit.radius = clamp(orbit.radius + e.deltaY*0.016, orbit.minR, orbit.maxR); applyOrbit(); }, {passive:false});
  window.addEventListener('resize', ()=>{
    camera.aspect = viewport.clientWidth/viewport.clientHeight; camera.updateProjectionMatrix();
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
  });

  /* -------- lighting: soft studio -------- */
  scene.add(new THREE.HemisphereLight(0x8ea6c0, 0x0a0d12, 0.35));
  const key = new THREE.DirectionalLight(0xfff2e0, 2.1);
  key.position.set(9,17,11); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048);
  key.shadow.camera.left=-22;key.shadow.camera.right=22;key.shadow.camera.top=22;key.shadow.camera.bottom=-22;
  key.shadow.camera.far=64;key.shadow.bias=-0.0005;key.shadow.radius=4;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0x9fb6d0, 0.5); fill.position.set(-12,7,-9); scene.add(fill);
  const rim = new THREE.DirectionalLight(0xcfe0f5, 0.35); rim.position.set(-6,9,-14); scene.add(rim);

  /* -------- floor + soft contact shadow -------- */
  const floor = new THREE.Mesh(new THREE.CylinderGeometry(46,46,0.5,64),
    new THREE.MeshStandardMaterial({color:0x0a0d13, roughness:0.98, metalness:0.05, envMapIntensity:0.25}));
  floor.position.y=-0.25; floor.receiveShadow=true; scene.add(floor);
  const grid = new THREE.GridHelper(90, 60, 0x1a2431, 0x121924);
  grid.position.y=0.015; grid.material.transparent=true; grid.material.opacity=0.42; scene.add(grid);

  function contactShadow(x,z,r){
    const cv=document.createElement('canvas'); cv.width=cv.height=256;
    const g=cv.getContext('2d'); const rg=g.createRadialGradient(128,128,0,128,128,128);
    rg.addColorStop(0,'rgba(0,0,0,0.55)'); rg.addColorStop(0.6,'rgba(0,0,0,0.28)'); rg.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=rg; g.fillRect(0,0,256,256);
    const t=new THREE.CanvasTexture(cv);
    const m=new THREE.Mesh(new THREE.PlaneGeometry(r,r*0.62),
      new THREE.MeshBasicMaterial({map:t, transparent:true, depthWrite:false}));
    m.rotation.x=-Math.PI/2; m.position.set(x,0.03,z); scene.add(m);
  }
  contactShadow(-5.4,0.4,9); contactShadow(2.2,0.6,11);

  /* -------- materials (PBR) -------- */
  const M = {
    steel: new THREE.MeshStandardMaterial({color:0x9aa6b4, roughness:0.28, metalness:0.9, envMapIntensity:0.9}),
    machinedSteel: new THREE.MeshStandardMaterial({color:0xc2cad4, roughness:0.18, metalness:0.95, envMapIntensity:1.0}),
    castPrime: new THREE.MeshStandardMaterial({color:0x2b3138, roughness:0.5, metalness:0.5, envMapIntensity:0.7}),
    castAlt: new THREE.MeshStandardMaterial({color:0x30474a, roughness:0.44, metalness:0.48, envMapIntensity:0.7}),
    darkMetal: new THREE.MeshStandardMaterial({color:0x232a33, roughness:0.5, metalness:0.55, envMapIntensity:0.6}),
    bedMetal: new THREE.MeshStandardMaterial({color:0x171d25, roughness:0.62, metalness:0.4, envMapIntensity:0.5}),
    copper: new THREE.MeshStandardMaterial({color:0xb0713c, roughness:0.32, metalness:0.85, envMapIntensity:0.8}),
    insulator: new THREE.MeshStandardMaterial({color:0x0d1219, roughness:0.55, metalness:0.1, envMapIntensity:0.4}),
    paintStripe: new THREE.MeshStandardMaterial({color:0x11151b, roughness:0.7, metalness:0.2}),
    indTeal: new THREE.MeshStandardMaterial({color:0x54b0a9, emissive:0x1c5450, emissiveIntensity:1.0, roughness:0.4, metalness:0.2}),
    indRed: new THREE.MeshStandardMaterial({color:0xd5604f, emissive:0x5c2019, emissiveIntensity:1.0, roughness:0.4, metalness:0.2}),
  };
  const phaseCol = [0xb1564a, 0xb59440, 0x5f7f9c]; // muted R Y B
  const busMat = phaseCol.map(c=>new THREE.MeshStandardMaterial({color:c, roughness:0.42, metalness:0.6, envMapIntensity:0.6}));

  /* -------- bedplate -------- */
  const bed = new THREE.Mesh(new THREE.BoxGeometry(15.5,0.6,4.8), M.bedMetal);
  bed.position.set(-1.4,0.3,0); bed.castShadow=true; bed.receiveShadow=true; scene.add(bed);
  [[-6.4],[ -1.2],[3.6]].forEach(([bx])=>{
    const rail=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.22,4.8), M.darkMetal);
    rail.position.set(bx,0.68,0); rail.castShadow=true; scene.add(rail);
  });

  /* -------- prime mover (DC drive) -------- */
  const prime = new THREE.Group();
  const pBody=new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.55,3.4,44), M.castPrime);
  pBody.rotation.z=Math.PI/2; pBody.castShadow=true; prime.add(pBody);
  for(let i=0;i<12;i++){ const r=new THREE.Mesh(new THREE.TorusGeometry(1.58,0.045,8,44),M.castPrime); r.rotation.y=Math.PI/2; r.position.x=-1.55+i*0.28; r.castShadow=true; prime.add(r);}
  [1.8,-1.8].forEach(px=>{ const bell=new THREE.Mesh(new THREE.CylinderGeometry(1.6,1.6,0.35,44),M.darkMetal); bell.rotation.z=Math.PI/2; bell.position.x=px; bell.castShadow=true; prime.add(bell);});
  const brushBand=new THREE.Mesh(new THREE.CylinderGeometry(1.62,1.62,0.5,44),M.steel); brushBand.rotation.z=Math.PI/2; brushBand.position.x=1.45; prime.add(brushBand);
  const pFeet=new THREE.Mesh(new THREE.BoxGeometry(3.0,0.35,3.4),M.darkMetal); pFeet.position.y=-1.5; pFeet.castShadow=true; prime.add(pFeet);
  prime.position.set(-5.4, 2.35, 0); scene.add(prime);

  /* -------- alternator -------- */
  const alt = new THREE.Group();
  const aBody=new THREE.Mesh(new THREE.CylinderGeometry(1.85,1.85,3.6,52), M.castAlt);
  aBody.rotation.z=Math.PI/2; aBody.castShadow=true; alt.add(aBody);
  for(let i=0;i<9;i++){ const r=new THREE.Mesh(new THREE.TorusGeometry(1.88,0.055,10,52),M.castAlt); r.rotation.y=Math.PI/2; r.position.x=-1.5+i*0.375; r.castShadow=true; alt.add(r);}
  [1.95,-1.95].forEach(px=>{ const bell=new THREE.Mesh(new THREE.CylinderGeometry(1.95,1.95,0.32,52),M.darkMetal); bell.rotation.z=Math.PI/2; bell.position.x=px; bell.castShadow=true; alt.add(bell);
    const brg=new THREE.Mesh(new THREE.CylinderGeometry(0.55,0.55,0.4,28),M.steel); brg.rotation.z=Math.PI/2; brg.position.x=px+ (px>0?0.12:-0.12); alt.add(brg);});
  // terminal box + bushings
  const tbox=new THREE.Mesh(new THREE.BoxGeometry(1.6,0.72,1.7),M.darkMetal); tbox.position.set(0.2,1.95,0); tbox.castShadow=true; alt.add(tbox);
  const altTerm=[];
  for(let i=0;i<3;i++){
    const bx=-0.2+i*0.4;
    const bush=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.15,0.6,18), M.insulator); bush.position.set(bx,2.5,0); alt.add(bush);
    const cap=new THREE.Mesh(new THREE.SphereGeometry(0.13,16,16), busMat[i]); cap.position.set(bx,2.82,0); alt.add(cap);
    altTerm.push(new THREE.Vector3(bx,2.82,0));
  }
  const aFeet=new THREE.Mesh(new THREE.BoxGeometry(3.5,0.35,4.0),M.darkMetal); aFeet.position.y=-1.78; aFeet.castShadow=true; alt.add(aFeet);
  const plate=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.55,0.95),M.steel); plate.position.set(1.87,-0.2,1.35); alt.add(plate);
  alt.position.set(2.2, 2.65, 0); scene.add(alt);

  /* -------- shaft + coupling (spins) -------- */
  const shaftGrp = new THREE.Group();
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,4.2,20), M.machinedSteel); shaft.rotation.z=Math.PI/2; shaft.castShadow=true; shaftGrp.add(shaft);
  const coup=new THREE.Mesh(new THREE.CylinderGeometry(0.52,0.52,0.85,32), M.steel); coup.rotation.z=Math.PI/2; coup.castShadow=true; shaftGrp.add(coup);
  // machined flats + a single matte reference line so rotation reads without glow
  const refLine=new THREE.Mesh(new THREE.BoxGeometry(0.86,0.02,0.13), M.paintStripe); refLine.position.set(0,0.5,0); shaftGrp.add(refLine);
  for(let i=0;i<6;i++){ const a=i/6*Math.PI*2; const bolt=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.9,6),M.darkMetal); bolt.rotation.z=Math.PI/2; bolt.position.set(0,Math.cos(a)*0.4,Math.sin(a)*0.4); shaftGrp.add(bolt);}
  shaftGrp.position.set(-1.6, 2.65, 0); scene.add(shaftGrp);

  /* -------- overhead bus bars -------- */
  const busY=[7.5,6.85,6.2];
  const busBars=[];
  busY.forEach((y,i)=>{ const bar=new THREE.Mesh(new THREE.BoxGeometry(24,0.24,0.24), busMat[i]); bar.position.set(0,y,-2.4); bar.castShadow=true; scene.add(bar); busBars.push(bar);});
  for(let x=-10;x<=10;x+=5){
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.13,0.19,2.2,12),M.insulator); post.position.set(x, busY[2]-1.1, -2.4); scene.add(post);
    const cap=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.12,0.7),M.darkMetal); cap.position.set(x,busY[0]+0.2,-2.4); scene.add(cap);
  }

  // power-flow arrows (muted teal, appear when P>0)
  const arrows=[];
  for(let i=0;i<9;i++){
    const cone=new THREE.Mesh(new THREE.ConeGeometry(0.13,0.42,12), new THREE.MeshStandardMaterial({color:0x54b0a9, emissive:0x1c4a47, emissiveIntensity:0.6, roughness:0.5, metalness:0.2}));
    cone.rotation.z=-Math.PI/2; cone.position.set(-10+i*2.4, busY[1], -2.4); cone.visible=false; scene.add(cone); arrows.push(cone);
  }

  /* -------- circuit breaker -------- */
  const cbGrp=new THREE.Group();
  const cbBox=new THREE.Mesh(new THREE.BoxGeometry(1.5,2.1,1.3), M.darkMetal); cbBox.castShadow=true; cbGrp.add(cbBox);
  const cbFace=new THREE.Mesh(new THREE.BoxGeometry(0.05,1.6,1.0), M.bedMetal); cbFace.position.x=0.76; cbGrp.add(cbFace);
  for(let i=0;i<3;i++){ const c=new THREE.Mesh(new THREE.CylinderGeometry(0.075,0.075,0.5,12),M.copper); c.position.set(-0.42+i*0.42,-0.7,0.72); cbGrp.add(c);}
  const blade=new THREE.Group();
  for(let i=0;i<3;i++){ const c=new THREE.Mesh(new THREE.CylinderGeometry(0.085,0.085,0.7,12),M.copper); c.position.set(-0.42+i*0.42,0,0.72); blade.add(c);}
  blade.position.y=0.95; cbGrp.add(blade);
  const arc=new THREE.PointLight(0x54b0a9, 0, 3.5); arc.position.set(0,-0.4,0.9); cbGrp.add(arc);
  const cbLamp=new THREE.Mesh(new THREE.SphereGeometry(0.15,18,18), M.indRed); cbLamp.position.set(0.4,1.35,0.72); cbGrp.add(cbLamp);
  cbGrp.position.set(2.4, 5.15, 2.3); scene.add(cbGrp);

  // cables
  function cable(p0,p1,p2,color){
    const g=new THREE.TubeGeometry(new THREE.CatmullRomCurve3([p0,p1,p2]),24,0.055,8,false);
    return new THREE.Mesh(g,new THREE.MeshStandardMaterial({color,roughness:0.55,metalness:0.2,envMapIntensity:0.4}));
  }
  for(let i=0;i<3;i++){
    const t=altTerm[i].clone().add(alt.position);
    const cbTop=new THREE.Vector3(2.0+i*0.42-0.42, 6.55, 2.3);
    scene.add(cable(t, new THREE.Vector3((t.x+cbTop.x)/2, t.y+1.7, (t.z+cbTop.z)/2), cbTop, phaseCol[i]));
    const cbBot=new THREE.Vector3(2.0+i*0.42-0.42, 4.15, 2.3);
    const busPt=new THREE.Vector3(2.0+i*0.42-0.42, busY[i], -2.35);
    scene.add(cable(cbBot, new THREE.Vector3(cbBot.x,(cbBot.y+busY[i])/2,(cbBot.z+busPt.z)/2), busPt, phaseCol[i]));
  }

  /* ================= synchroscope ticks ================= */
  (function(){
    const g=$('scTicks'), cx=66,cy=66,r=58;
    for(let i=0;i<24;i++){
      const a=i/24*Math.PI*2, major=i%6===0, r0=major?r-8:r-4;
      const l=document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',cx+r0*Math.sin(a)); l.setAttribute('y1',cy-r0*Math.cos(a));
      l.setAttribute('x2',cx+r*Math.sin(a)); l.setAttribute('y2',cy-r*Math.cos(a));
      l.setAttribute('stroke', major?'#33404f':'#1f2833'); l.setAttribute('stroke-width', major?1.4:0.9);
      g.appendChild(l);
    }
  })();

  /* ================= scope ================= */
  const scv=$('scopeCv'), sctx=scv.getContext('2d');
  function drawScope(){
    const w=scv.width, h=scv.height, mid=h/2;
    sctx.clearRect(0,0,w,h);
    sctx.strokeStyle='rgba(30,40,52,0.55)'; sctx.lineWidth=1;
    for(let x=0;x<=w;x+=w/8){ sctx.beginPath();sctx.moveTo(x,0);sctx.lineTo(x,h);sctx.stroke(); }
    for(let y=0;y<=h;y+=h/4){ sctx.beginPath();sctx.moveTo(0,y);sctx.lineTo(w,y);sctx.stroke(); }
    sctx.strokeStyle='rgba(45,58,72,0.8)'; sctx.beginPath();sctx.moveTo(0,mid);sctx.lineTo(w,mid);sctx.stroke();
    const cycles=2.2, amp=h*0.36;
    // bus reference
    sctx.strokeStyle='#7b93a8'; sctx.lineWidth=1.5; sctx.beginPath();
    for(let x=0;x<=w;x++){ const tt=x/w*cycles*2*Math.PI; const y=mid-amp*Math.sin(tt+S.scopeT); x===0?sctx.moveTo(x,y):sctx.lineTo(x,y);} sctx.stroke();
    // alternator
    const va=S.onBus?1:(S.exc/BUS.V), ph=S.onBus?0:S.phi;
    sctx.strokeStyle='#dda24e'; sctx.lineWidth=1.6; sctx.beginPath();
    for(let x=0;x<=w;x++){ const tt=x/w*cycles*2*Math.PI; const y=mid-amp*va*Math.sin(tt+S.scopeT+ph); x===0?sctx.moveTo(x,y):sctx.lineTo(x,y);} sctx.stroke();
  }

  /* ================= UI wiring ================= */
  function setFill(el){ const p=(el.value-el.min)/(el.max-el.min)*100; el.style.setProperty('--fill',p+'%'); }

  document.querySelectorAll('#methodSeg .seg-opt').forEach(o=>o.addEventListener('click',()=>{
    document.querySelectorAll('#methodSeg .seg-opt').forEach(x=>x.classList.remove('active'));
    o.classList.add('active'); S.method=o.dataset.m;
  }));

  const fSlider=$('fSlider'), eSlider=$('eSlider');
  fSlider.addEventListener('input',()=>{ S.fAlt=+fSlider.value; $('fVal').textContent=S.fAlt.toFixed(2)+' Hz'; setFill(fSlider); });
  eSlider.addEventListener('input',()=>{ S.exc=+eSlider.value; S.excLoad=+eSlider.value; $('eVal').textContent=S.exc+' V'; setFill(eSlider); });
  [fSlider,eSlider].forEach(setFill);

  const seqSwitch=$('seqSwitch');
  seqSwitch.addEventListener('click',()=>{
    S.seqCorrect=!S.seqCorrect;
    seqSwitch.classList.toggle('on',S.seqCorrect); seqSwitch.classList.toggle('warn',!S.seqCorrect);
    $('seqTxt').textContent = S.seqCorrect?'R · Y · B — matched':'R · B · Y — reversed';
  });

  $('closeBtn').addEventListener('click',()=>{ condStates().ready() ? synchronise() : doTrip(); });
  $('openBtn').addEventListener('click', desync);

  const thSlider=$('thSlider'), e2Slider=$('e2Slider');
  thSlider.addEventListener('input',()=>{ S.throttle=+thSlider.value; $('thVal').textContent=S.throttle+' %'; setFill(thSlider); });
  e2Slider.addEventListener('input',()=>{ S.excLoad=+e2Slider.value; $('e2Val').textContent=S.excLoad+' V'; setFill(e2Slider); });
  [thSlider,e2Slider].forEach(setFill);

  $('ptoggle').addEventListener('click',()=>$('side').classList.toggle('open'));

  // controls hint — show briefly, then collapse to a small affordance that re-reveals on hover
  const viewHint=$('viewHint'), hintDot=$('hintDot');
  let hintDismissed=false;
  function stowHint(){ if(hintDismissed) return; hintDismissed=true; viewHint.classList.add('hidden'); hintDot.classList.add('show'); }
  const hintTimer=setTimeout(stowHint, 6000);
  ['pointerdown','wheel'].forEach(ev=>canvas.addEventListener(ev, ()=>{ clearTimeout(hintTimer); stowHint(); }, {passive:true}));
  hintDot.addEventListener('mouseenter', ()=>viewHint.classList.remove('hidden'));
  hintDot.addEventListener('mouseleave', ()=>{ if(hintDismissed) viewHint.classList.add('hidden'); });

  function synchronise(){
    S.onBus=true; S.trip=false; S.phi=0;
    $('pane-sync').style.display='none'; $('pane-load').style.display='block';
    $('e2Slider').value=S.exc; S.excLoad=S.exc; $('e2Val').textContent=S.exc+' V'; setFill($('e2Slider'));
    setStatus('synced','On bus — synchronised'); $('clusterSub').textContent='on bus';
  }
  function desync(){
    S.onBus=false; S.throttle=0; S.delta=0;
    $('thSlider').value=0; $('thVal').textContent='0 %'; setFill($('thSlider'));
    $('pane-load').style.display='none'; $('pane-sync').style.display='block';
    setStatus('off','Off bus'); $('clusterSub').textContent='off bus';
  }
  function doTrip(){
    S.trip=true; S.tripTimer=1.6; setStatus('trip','Out of sync — breaker tripped');
    document.body.classList.add('flash-trip'); setTimeout(()=>document.body.classList.remove('flash-trip'),1400);
  }
  function setStatus(s,txt){ $('statusChip').dataset.s=s; $('statusText').textContent=txt; }

  /* ================= loop ================= */
  const clock=new THREE.Clock();
  const scP=$('scPointer'), scRead=$('scReadout'), scState=$('scState'), scRef=$('scRefMark');
  const lampEls=[$('l0'),$('l1'),$('l2')], lampFila=lampEls.map(e=>e.querySelector('.fila'));

  function frame(){
    requestAnimationFrame(frame);
    const dt=Math.min(clock.getDelta(),0.05), c=condStates();

    if(!S.onBus && !S.trip){ S.phi=wrapPi(S.phi + 2*Math.PI*c.df*dt); }
    if(S.trip){ S.tripTimer-=dt; S.phi=wrapPi(S.phi + 2*Math.PI*c.df*dt); if(S.tripTimer<=0){ S.trip=false; setStatus(c.ready()?'ready':'off', c.ready()?'Ready to close':'Off bus'); } }

    S.scopeT += dt*3.2;
    const targetRate = S.onBus ? 6.0 : (6.0*S.fAlt/50);
    S.shaftAngle += targetRate*dt; shaftGrp.rotation.x=S.shaftAngle;

    S.breaker += ((S.onBus?1:0)-S.breaker)*Math.min(1,dt*6);
    blade.position.y = 0.95 - S.breaker*0.95;
    const closed=S.breaker>0.6;
    cbLamp.material = closed?M.indTeal:M.indRed;
    arc.color.set(0x54b0a9); arc.intensity = closed?0.9:0;

    if(S.onBus) computeLoad();
    const showFlow=S.onBus && S.P>0.05, tt=performance.now()/1000;
    arrows.forEach((a,i)=>{ a.visible=showFlow; if(showFlow){ a.position.x=-10+((i*2.4+tt*3.0)%22); const g=clamp(S.P/6,0.25,1); a.scale.setScalar(0.7+g*0.5);} });

    // synchroscope
    if(!S.onBus){
      scP.setAttribute('transform',`rotate(${S.phi/DEG} 66 66)`);
      const good=c.pOk && c.fOk;
      scP.classList.toggle('good',good); scRef.classList.toggle('good', c.ready());
      scRead.textContent='Δf '+c.df.toFixed(2)+' Hz';
      scState.textContent = c.ready()?'ready':(Math.abs(c.df)<0.02?'creeping':(c.df>0?'running fast':'running slow'));
      scState.setAttribute('fill', c.ready()?'#dda24e':'#5c697b');
      $('scopePhase').textContent='Δθ '+Math.round(Math.abs(S.phi/DEG))+'°';
    } else {
      scP.setAttribute('transform','rotate(0 66 66)'); scP.classList.add('good'); scRef.classList.add('good');
      scRead.textContent='locked'; scState.textContent='synchronous'; scState.setAttribute('fill','#54b0a9');
      $('scopePhase').textContent='Δθ 0°';
    }

    // lamps
    const offs=lampOffsets();
    lampEls.forEach((el,i)=>{
      let b = S.onBus?0 : (S.method==='scope'?0.05 : lampBrightness(wrapPi(S.phi+offs[i])));
      lampFila[i].style.opacity=b.toFixed(3);
      el.style.boxShadow = b>0.2 ? `inset 0 1px 3px rgba(0,0,0,0.5), 0 0 ${(b*10).toFixed(0)}px rgba(240,170,70,${(b*0.5).toFixed(2)})` : 'inset 0 1px 3px rgba(0,0,0,0.7)';
    });

    if(!S.onBus){
      updateCond('v',c.vOk,(c.dv>=0?'+':'')+c.dv+' V');
      updateCond('f',c.fOk,(c.df>=0?'+':'')+c.df.toFixed(2)+' Hz');
      updateCond('p',c.pOk,Math.abs(S.phi/DEG).toFixed(0)+'°');
      updateCond('s',c.sOk,'');
      const armed=c.ready();
      $('closeBtn').classList.toggle('primary',true); $('closeBtn').classList.toggle('armed',armed);
      if(!S.trip) setStatus(armed?'ready':'off', armed?'Ready to close':'Off bus');
      $('clusterSub').textContent = armed?'ready':'off bus';
    } else {
      $('pOut').textContent=S.P.toFixed(2)+' kW';
      $('deltaOut').textContent=(S.delta/DEG).toFixed(1)+'°';
      $('qOut').textContent=(S.Q>=0?'+':'')+S.Q.toFixed(1)+' kVAR';
      $('qOut').className='rv '+(Math.abs(S.Q)<0.3?'ok':'warn');
      $('exState').textContent = S.excLoad>422?'Over-excited':S.excLoad<408?'Under-excited':'Normal';
      $('exState').className='rv '+(Math.abs(S.excLoad-415)<8?'ok':'warn');
      $('iaOut').textContent=S.Ia.toFixed(1)+' A';
      $('sOut').textContent=S.Sapp.toFixed(1)+' kVA';
      $('pfOut').textContent=S.pf.toFixed(2)+(Math.abs(S.Q)<0.3?'':(S.Q>0?' lag':' lead'));
    }

    drawScope();
    renderer.render(scene,camera);
  }
  function updateCond(key,ok,txt){
    const el=document.querySelector(`.check[data-c="${key}"]`);
    el.classList.toggle('ok',ok); el.classList.toggle('no',!ok);
    el.querySelector('.mk').textContent = ok?'✓':'!';
    const span={v:'cVd',f:'cFd',p:'cPd'}[key]; if(span) $(span).textContent=txt;
  }

  frame();
  const ld=$('loading'); ld.style.opacity='0'; setTimeout(()=>ld.remove(),520);
}
<\/script>
</body>
</html>
</script>
<script type="text/html" id="tpl-zpf"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Alternator Regulation — ZPF (Potier) Method</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0d17; --bg-2:#0c1020;
    --surface:rgba(18,22,38,0.74); --surface-2:rgba(15,18,32,0.80); --surface-hi:#1a1f33;
    --line:#222a44; --line-2:#2d3760;
    --txt:#ccd3e6; --txt-2:#8790b0; --txt-3:#5a6288;
    --indigo:#7c8cf0; --indigo-2:#5f6fca; --indigo-soft:rgba(124,140,240,0.14);
    --ochre:#d9a24e; --ochre-soft:rgba(217,162,78,0.13);
    --ok:#5fb08f; --fault:#d56a86; --steel:#6d7ba0; --rose:#d07a9a;
    --shadow:0 10px 30px rgba(0,0,0,0.42);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:'Inter',system-ui,-apple-system,sans-serif;overflow:hidden;font-size:14px;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  .backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1200px 700px at 62% 6%, rgba(46,52,92,0.34), transparent 60%),
      radial-gradient(900px 900px at 50% 120%, rgba(0,0,0,0.55), transparent 55%);}

  /* top bar */
  #topbar{position:fixed;top:0;left:0;right:0;height:58px;z-index:50;display:flex;align-items:center;
    justify-content:space-between;padding:0 20px;background:linear-gradient(180deg, rgba(12,15,28,0.94), rgba(12,15,28,0.72));
    border-bottom:1px solid var(--line);backdrop-filter:blur(10px);}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{width:30px;height:30px;border-radius:7px;background:var(--surface-hi);border:1px solid var(--line-2);
    display:flex;align-items:center;justify-content:center;}
  .brand-mark svg{width:17px;height:17px;}
