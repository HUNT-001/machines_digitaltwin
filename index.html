<script>
window.addEventListener('load', () => {
  try { boot(); }
  catch(e){ document.getElementById('loading').innerHTML =
    '<div style="color:#d56a86;font-family:Inter;font-size:13px;max-width:420px;text-align:center;line-height:1.6;">3D engine failed to start:<br>'+e.message+'</div>'; console.error(e); }
});

function boot(){
  const DEG=Math.PI/180, $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
  const clamp=(v,a,b)=>Math.min(Math.max(v,a),b);

  /* ---------- machine data ---------- */
  const OCC=[[0,0],[0.4,100],[0.8,190],[1.2,255],[1.6,300],[2.0,330],[2.4,352],[2.8,366],[3.2,375]];
  const Vr=240, Iar=15, Xl=1.2, FarR=0.55;
  const AIR=250; // air-gap line slope V/A (initial OCC slope)
  function occ(f){ f=clamp(f,0,OCC[OCC.length-1][0]);
    for(let i=0;i<OCC.length-1;i++){ const a=OCC[i],b=OCC[i+1]; if(f>=a[0]&&f<=b[0]){ const t=(f-a[0])/(b[0]-a[0]); return a[1]+t*(b[1]-a[1]); } }
    return OCC[OCC.length-1][1]; }
  function occInv(E){ E=clamp(E,0,OCC[OCC.length-1][1]);
    for(let i=0;i<OCC.length-1;i++){ const a=OCC[i],b=OCC[i+1]; if(E>=a[1]&&E<=b[1]){ const t=(E-a[1])/(b[1]-a[1]); return a[0]+t*(b[0]-a[0]); } }
    return OCC[OCC.length-1][0]; }
  function zpf(f){ return Math.max(0, occ(f-FarR) - Iar*Xl); }

  const S={ loadPct:100, phiDeg:37, showCon:true, showAir:true, shaft:0, regHist:0 };

  function compute(){
    const I=Iar*S.loadPct/100, phi=S.phiDeg*DEG, cs=Math.cos(phi), sn=Math.sin(phi);
    const IXL=I*Xl;
    const E1=Math.sqrt(Math.pow(Vr*cs,2)+Math.pow(Vr*sn+IXL,2));
    const If1=occInv(E1);
    const Far=FarR*(I/Iar);
    const FR=Math.sqrt(If1*If1+Far*Far+2*If1*Far*sn);
    const E0=occ(FR);
    const reg=(E0-Vr)/Vr*100;
    return {I,phi,cs,sn,IXL,E1,If1,Far,FR,E0,reg};
  }
  function regAt(phiDeg){ // regulation at given pf angle for current load
    const I=Iar*S.loadPct/100, phi=phiDeg*DEG, sn=Math.sin(phi), cs=Math.cos(phi), IXL=I*Xl;
    const E1=Math.sqrt(Math.pow(Vr*cs,2)+Math.pow(Vr*sn+IXL,2));
    const If1=occInv(E1), Far=FarR*(I/Iar);
    const FR=Math.sqrt(If1*If1+Far*Far+2*If1*Far*sn);
    return (occ(FR)-Vr)/Vr*100;
  }

  /* ================= SVG chart helpers ================= */
  function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent)parent.appendChild(e); return e; }
  function clr(svg){ while(svg.firstChild) svg.removeChild(svg.firstChild); }

  // ---- OCC / ZPF chart ----
  const occSvg=$('occChart');
  const OX0=44,OX1=466,OY0=270,OY1=16, FMAX=3.6, EMAX=400;
  const oX=f=>OX0+(f/FMAX)*(OX1-OX0), oY=e=>OY0+(e/EMAX)*(OY1-OY0);
  function drawOCC(){
    clr(occSvg); const d=compute();
    // grid
    for(let f=0;f<=FMAX;f+=0.5){ const x=oX(f); el('line',{x1:x,y1:OY1,x2:x,y2:OY0,stroke:'#18203a','stroke-width':f%1===0?1:0.6},occSvg); }
    for(let e=0;e<=EMAX;e+=50){ const y=oY(e); el('line',{x1:OX0,y1:y,x2:OX1,y2:y,stroke:'#18203a','stroke-width':e%100===0?1:0.6},occSvg); }
    // axes
    el('line',{x1:OX0,y1:OY0,x2:OX1,y2:OY0,stroke:'#2d3760','stroke-width':1.2},occSvg);
    el('line',{x1:OX0,y1:OY1,x2:OX0,y2:OY0,stroke:'#2d3760','stroke-width':1.2},occSvg);
    for(let f=0;f<=FMAX;f+=1){ el('text',{x:oX(f),y:OY0+14,fill:'#5a6288','font-size':9,'text-anchor':'middle','font-family':'IBM Plex Mono'},occSvg).textContent=f.toFixed(0); }
    for(let e=0;e<=EMAX;e+=100){ el('text',{x:OX0-6,y:oY(e)+3,fill:'#5a6288','font-size':9,'text-anchor':'end','font-family':'IBM Plex Mono'},occSvg).textContent=e; }
    el('text',{x:(OX0+OX1)/2,y:OY0+26,fill:'#8790b0','font-size':10,'text-anchor':'middle'},occSvg).textContent='Field current  If  (A)';
    el('text',{x:14,y:(OY0+OY1)/2,fill:'#8790b0','font-size':10,'text-anchor':'middle',transform:`rotate(-90 14 ${(OY0+OY1)/2})`},occSvg).textContent='EMF / Voltage  (V, per phase)';
    // air-gap line
    if(S.showAir){ const fe=EMAX/AIR; el('line',{x1:oX(0),y1:oY(0),x2:oX(fe),y2:oY(EMAX),stroke:'#6d7ba0','stroke-width':1,'stroke-dasharray':'4 4',opacity:0.8},occSvg);
      el('text',{x:oX(fe)+2,y:oY(EMAX)+10,fill:'#6d7ba0','font-size':8.5},occSvg).textContent='air-gap'; }
    // OCC
    let p=''; for(let f=0;f<=3.2;f+=0.05){ p+=(p?'L':'M')+oX(f)+' '+oY(occ(f)); }
    el('path',{d:p,fill:'none',stroke:'#7c8cf0','stroke-width':2},occSvg);
    // ZPF
    let z='',started=false; for(let f=FarR;f<=FMAX;f+=0.05){ const v=zpf(f); if(v<=0.1&&!started)continue; z+=(z?'L':'M')+oX(f)+' '+oY(v); started=true; }
    el('path',{d:z,fill:'none',stroke:'#d9a24e','stroke-width':2},occSvg);
    // curve labels
    el('text',{x:oX(2.55),y:oY(occ(2.55))-8,fill:'#7c8cf0','font-size':10,'font-weight':600},occSvg).textContent='OCC';
    el('text',{x:oX(3.0),y:oY(zpf(3.0))+16,fill:'#d9a24e','font-size':10,'font-weight':600},occSvg).textContent='ZPF';
    // Potier triangle (fixed, full-load)
    const Rx=occInv(Vr+Iar*Xl), Ry=Vr+Iar*Xl, Sx=Rx, Sy=Vr, Px=Rx+FarR, Py=Vr;
    el('polygon',{points:`${oX(Rx)},${oY(Ry)} ${oX(Sx)},${oY(Sy)} ${oX(Px)},${oY(Py)}`,fill:'rgba(124,140,240,0.12)',stroke:'#8b9af5','stroke-width':1.4},occSvg);
    ['R','S','P'].forEach((t,i)=>{ const pt=[[Rx,Ry],[Sx,Sy],[Px,Py]][i]; el('circle',{cx:oX(pt[0]),cy:oY(pt[1]),r:2.4,fill:'#8b9af5'},occSvg);
      el('text',{x:oX(pt[0])+(i===2?5:-9),y:oY(pt[1])+(i===0?-4:12),fill:'#aab2cc','font-size':9,'font-weight':600},occSvg).textContent=t; });
    el('text',{x:oX(Sx)-4,y:(oY(Ry)+oY(Sy))/2,fill:'#8b9af5','font-size':8.5,'text-anchor':'end'},occSvg).textContent='IₐX_L';
    el('text',{x:(oX(Sx)+oX(Px))/2,y:oY(Sy)+11,fill:'#d9a24e','font-size':8.5,'text-anchor':'middle'},occSvg).textContent='Fₐᵣ';
    // operating construction
    if(S.showCon){
      el('line',{x1:OX0,y1:oY(Vr),x2:OX1,y2:oY(Vr),stroke:'#3a456e','stroke-width':1,'stroke-dasharray':'2 3'},occSvg);
      // E1 point on OCC
      el('line',{x1:oX(d.If1),y1:OY0,x2:oX(d.If1),y2:oY(d.E1),stroke:'#d07a9a','stroke-width':0.8,'stroke-dasharray':'2 3'},occSvg);
      el('circle',{cx:oX(d.If1),cy:oY(d.E1),r:3,fill:'#d07a9a'},occSvg);
      el('text',{x:oX(d.If1)+5,y:oY(d.E1)-4,fill:'#d07a9a','font-size':8.5},occSvg).textContent='E₁';
      // FR / E0 point
      el('line',{x1:oX(d.FR),y1:OY0,x2:oX(d.FR),y2:oY(d.E0),stroke:'#7c8cf0','stroke-width':0.8,'stroke-dasharray':'2 3'},occSvg);
      el('line',{x1:OX0,y1:oY(d.E0),x2:oX(d.FR),y2:oY(d.E0),stroke:'#7c8cf0','stroke-width':0.8,'stroke-dasharray':'2 3'},occSvg);
      el('circle',{cx:oX(d.FR),cy:oY(d.E0),r:3.4,fill:'#7c8cf0'},occSvg);
      el('text',{x:oX(d.FR)+5,y:oY(d.E0)-4,fill:'#9fabf7','font-size':8.5,'font-weight':600},occSvg).textContent='E₀';
      // regulation bracket on y-axis
      el('line',{x1:OX0+6,y1:oY(Vr),x2:OX0+6,y2:oY(d.E0),stroke:d.reg>=0?'#d9a24e':'#5fb08f','stroke-width':2},occSvg);
    }
  }

  // ---- phasor diagram ----
  const phSvg=$('phasor');
  function arrow(svg,x0,y0,x1,y1,color,w){ el('line',{x1:x0,y1:y0,x2:x1,y2:y1,stroke:color,'stroke-width':w||1.6,'stroke-linecap':'round'},svg);
    const a=Math.atan2(y1-y0,x1-x0),L=5; el('polygon',{points:`${x1},${y1} ${x1-L*Math.cos(a-0.4)},${y1-L*Math.sin(a-0.4)} ${x1-L*Math.cos(a+0.4)},${y1-L*Math.sin(a+0.4)}`,fill:color},svg); }
  function drawPhasor(){
    clr(phSvg); const d=compute(); const ox=34,oy=150, k=0.46;
    for(let i=0;i<=4;i++){ el('line',{x1:20,y1:oy-i*32,x2:210,y2:oy-i*32,stroke:'#151b30','stroke-width':0.6},phSvg); }
    el('line',{x1:ox,y1:20,x2:ox,y2:oy,stroke:'#252d4d','stroke-width':0.8},phSvg);
    el('line',{x1:ox,y1:oy,x2:212,y2:oy,stroke:'#252d4d','stroke-width':0.8},phSvg);
    // V reference (+x)
    const Vx=ox+Vr*k, Vy=oy;
    arrow(phSvg,ox,oy,Vx,Vy,'#6d7ba0',2);
    el('text',{x:Vx-4,y:oy+13,fill:'#8fa0c0','font-size':9},phSvg).textContent='V';
    // current at -phi (lag below axis)
    const Ilen=64, ix=ox+Ilen*Math.cos(-d.phi), iy=oy-Ilen*Math.sin(-d.phi)*-1; // screen y down
    const iyy=oy+Ilen*Math.sin(d.phi);
    arrow(phSvg,ox,oy,ox+Ilen*Math.cos(d.phi),oy+Ilen*Math.sin(d.phi),'#8790b0',1.4);
    el('text',{x:ox+Ilen*Math.cos(d.phi)+3,y:oy+Ilen*Math.sin(d.phi)+ (d.phi>=0?12:-4),fill:'#8790b0','font-size':9},phSvg).textContent='Iₐ';
    // IXL from tip of V, perpendicular to I (leads I by 90°)
    const dirI=d.phi, dirIXL=dirI - Math.PI/2; // j*I leads by 90° (screen: subtract)
    const ex=Vx + d.IXL*k*Math.cos(dirIXL), ey=Vy + d.IXL*k*Math.sin(dirIXL);
    arrow(phSvg,Vx,Vy,ex,ey,'#d9a24e',1.6);
    el('text',{x:(Vx+ex)/2+4,y:(Vy+ey)/2,fill:'#d9a24e','font-size':8.5},phSvg).textContent='IₐX_L';
    // E1 resultant
    arrow(phSvg,ox,oy,ex,ey,'#7c8cf0',2);
    el('text',{x:ex+3,y:ey-3,fill:'#9fabf7','font-size':9,'font-weight':600},phSvg).textContent='E₁';
  }

  // ---- regulation vs pf ----
  const regSvg=$('regChart');
  const RX0=30,RX1=210,RY0=118,RY1=14, REGMAX=40;
  const rX=a=>RX0+((a+60)/120)*(RX1-RX0), rY=r=>((RY0+RY1)/2) - (r/REGMAX)*((RY0-RY1)/2);
  function drawReg(){
    clr(regSvg);
    for(let a=-60;a<=60;a+=30){ el('line',{x1:rX(a),y1:RY1,x2:rX(a),y2:RY0,stroke:'#151b30','stroke-width':0.6},regSvg); }
    el('line',{x1:RX0,y1:rY(0),x2:RX1,y2:rY(0),stroke:'#2d3760','stroke-width':1},regSvg);
    el('text',{x:RX0-2,y:rY(0)-2,fill:'#5a6288','font-size':8,'text-anchor':'end'},regSvg).textContent='0';
    el('text',{x:RX0,y:RY0+11,fill:'#5a6288','font-size':8},regSvg).textContent='lead';
    el('text',{x:RX1,y:RY0+11,fill:'#5a6288','font-size':8,'text-anchor':'end'},regSvg).textContent='lag';
    let p=''; for(let a=-60;a<=60;a+=2){ const r=clamp(regAt(a),-REGMAX,REGMAX); p+=(p?'L':'M')+rX(a)+' '+rY(r); }
    el('path',{d:p,fill:'none',stroke:'#7c8cf0','stroke-width':1.8},regSvg);
    const cr=clamp(regAt(S.phiDeg),-REGMAX,REGMAX);
    el('circle',{cx:rX(S.phiDeg),cy:rY(cr),r:3.4,fill:cr>=0?'#d9a24e':'#5fb08f'},regSvg);
  }

  /* ================= THREE.JS (machine under test) ================= */
  const canvas=$('three'), viewport=$('viewport');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(viewport.clientWidth,viewport.clientHeight);
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputEncoding=THREE.sRGBEncoding; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;

  const scene=new THREE.Scene(); scene.background=new THREE.Color(0x0a0d17); scene.fog=new THREE.FogExp2(0x0a0d17,0.02);
  const camera=new THREE.PerspectiveCamera(40,viewport.clientWidth/viewport.clientHeight,0.1,400);

  function buildEnv(){
    const c=document.createElement('canvas'); c.width=1024;c.height=512; const x=c.getContext('2d');
    const g=x.createLinearGradient(0,0,0,512); g.addColorStop(0,'#242a40');g.addColorStop(0.46,'#121624');g.addColorStop(0.54,'#0d1120');g.addColorStop(1,'#06080f');
    x.fillStyle=g; x.fillRect(0,0,1024,512);
    function soft(cx,cy,r,a){ const rg=x.createRadialGradient(cx,cy,0,cx,cy,r); rg.addColorStop(0,'rgba(200,210,240,'+a+')'); rg.addColorStop(1,'rgba(200,210,240,0)'); x.fillStyle=rg; x.fillRect(cx-r,cy-r,r*2,r*2); }
    soft(250,150,150,0.5); soft(720,120,120,0.28); soft(520,360,260,0.1);
    const tex=new THREE.CanvasTexture(c); tex.mapping=THREE.EquirectangularReflectionMapping;
    try{ const pm=new THREE.PMREMGenerator(renderer); pm.compileEquirectangularShader(); const rt=pm.fromEquirectangular(tex); tex.dispose(); pm.dispose(); return rt.texture; }catch(e){ return tex; }
  }
  scene.environment=buildEnv();

  const orbit={theta:0.9,phi:1.14,radius:24,minR:13,maxR:46,target:new THREE.Vector3(0.5,2.3,0)};
  function applyOrbit(){ const o=orbit,p=o.target.clone(); p.x+=o.radius*Math.sin(o.phi)*Math.sin(o.theta); p.y+=o.radius*Math.cos(o.phi); p.z+=o.radius*Math.sin(o.phi)*Math.cos(o.theta); camera.position.copy(p); camera.lookAt(o.target); }
  applyOrbit();
  let drag=false,mb=0,lx=0,ly=0;
  canvas.addEventListener('pointerdown',e=>{drag=true;mb=e.button;lx=e.clientX;ly=e.clientY;canvas.setPointerCapture(e.pointerId);});
  canvas.addEventListener('pointerup',()=>drag=false); canvas.addEventListener('pointerleave',()=>drag=false);
  canvas.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-lx,dy=e.clientY-ly; lx=e.clientX;ly=e.clientY;
    if(mb===2){ orbit.target.x-=dx*0.018*Math.cos(orbit.theta); orbit.target.z+=dx*0.018*Math.sin(orbit.theta); orbit.target.y+=dy*0.018; }
    else { orbit.theta-=dx*0.006; orbit.phi=clamp(orbit.phi-dy*0.006,0.28,Math.PI-0.34); } applyOrbit(); });
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); orbit.radius=clamp(orbit.radius+e.deltaY*0.016,orbit.minR,orbit.maxR); applyOrbit(); },{passive:false});
  window.addEventListener('resize',()=>{ camera.aspect=viewport.clientWidth/viewport.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(viewport.clientWidth,viewport.clientHeight); });

  scene.add(new THREE.HemisphereLight(0x9aa6d0,0x0a0d15,0.35));
  const key=new THREE.DirectionalLight(0xf3f0ff,2.0); key.position.set(9,17,11); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048); key.shadow.camera.left=-20;key.shadow.camera.right=20;key.shadow.camera.top=20;key.shadow.camera.bottom=-20;key.shadow.camera.far=60;key.shadow.bias=-0.0005;key.shadow.radius=4;
  scene.add(key);
  const fill=new THREE.DirectionalLight(0x8f9ed0,0.5); fill.position.set(-12,7,-9); scene.add(fill);

  const floor=new THREE.Mesh(new THREE.CylinderGeometry(46,46,0.5,64), new THREE.MeshStandardMaterial({color:0x090c15,roughness:0.98,metalness:0.05,envMapIntensity:0.25}));
  floor.position.y=-0.25; floor.receiveShadow=true; scene.add(floor);
  const grid=new THREE.GridHelper(90,60,0x1a2340,0x111830); grid.position.y=0.015; grid.material.transparent=true; grid.material.opacity=0.42; scene.add(grid);
  function contact(x,z,r){ const cv=document.createElement('canvas'); cv.width=cv.height=256; const g=cv.getContext('2d'); const rg=g.createRadialGradient(128,128,0,128,128,128); rg.addColorStop(0,'rgba(0,0,0,0.5)');rg.addColorStop(0.6,'rgba(0,0,0,0.26)');rg.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=rg; g.fillRect(0,0,256,256);
    const m=new THREE.Mesh(new THREE.PlaneGeometry(r,r*0.6), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthWrite:false})); m.rotation.x=-Math.PI/2; m.position.set(x,0.03,z); scene.add(m); }
  contact(-4.6,0.4,9); contact(2.4,0.5,10); contact(7.4,0,6);

  const M={
    steel:new THREE.MeshStandardMaterial({color:0x9aa2b6,roughness:0.28,metalness:0.9,envMapIntensity:0.9}),
    machined:new THREE.MeshStandardMaterial({color:0xc3c9d8,roughness:0.18,metalness:0.95,envMapIntensity:1.0}),
    castAlt:new THREE.MeshStandardMaterial({color:0x353b5c,roughness:0.44,metalness:0.48,envMapIntensity:0.7}),
    castMot:new THREE.MeshStandardMaterial({color:0x272c3e,roughness:0.5,metalness:0.5,envMapIntensity:0.6}),
    dark:new THREE.MeshStandardMaterial({color:0x1f2436,roughness:0.5,metalness:0.55,envMapIntensity:0.6}),
    bed:new THREE.MeshStandardMaterial({color:0x14182a,roughness:0.62,metalness:0.4,envMapIntensity:0.5}),
    copper:new THREE.MeshStandardMaterial({color:0xb0763f,roughness:0.34,metalness:0.85,envMapIntensity:0.8}),
    brass:new THREE.MeshStandardMaterial({color:0xc4a24e,roughness:0.34,metalness:0.85,envMapIntensity:0.8}),
    insul:new THREE.MeshStandardMaterial({color:0x0c1120,roughness:0.55,metalness:0.1,envMapIntensity:0.4}),
    stripe:new THREE.MeshStandardMaterial({color:0x10131f,roughness:0.7,metalness:0.2}),
  };

  const bed=new THREE.Mesh(new THREE.BoxGeometry(14,0.6,4.6),M.bed); bed.position.set(-1.4,0.3,0); bed.castShadow=true; bed.receiveShadow=true; scene.add(bed);
  // DC drive motor
  const mot=new THREE.Group();
  const mb1=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,3.2,44),M.castMot); mb1.rotation.z=Math.PI/2; mb1.castShadow=true; mot.add(mb1);
  for(let i=0;i<11;i++){ const r=new THREE.Mesh(new THREE.TorusGeometry(1.53,0.045,8,44),M.castMot); r.rotation.y=Math.PI/2; r.position.x=-1.45+i*0.29; mot.add(r); }
  [1.7,-1.7].forEach(px=>{ const b=new THREE.Mesh(new THREE.CylinderGeometry(1.55,1.55,0.32,44),M.dark); b.rotation.z=Math.PI/2; b.position.x=px; mot.add(b); });
  const mfeet=new THREE.Mesh(new THREE.BoxGeometry(2.8,0.35,3.2),M.dark); mfeet.position.y=-1.45; mot.add(mfeet);
  mot.position.set(-5.2,2.3,0); scene.add(mot);
  // alternator under test
  const alt=new THREE.Group();
  const ab=new THREE.Mesh(new THREE.CylinderGeometry(1.8,1.8,3.5,52),M.castAlt); ab.rotation.z=Math.PI/2; ab.castShadow=true; alt.add(ab);
  for(let i=0;i<9;i++){ const r=new THREE.Mesh(new THREE.TorusGeometry(1.83,0.05,10,52),M.castAlt); r.rotation.y=Math.PI/2; r.position.x=-1.45+i*0.365; r.castShadow=true; alt.add(r); }
  [1.9,-1.9].forEach(px=>{ const b=new THREE.Mesh(new THREE.CylinderGeometry(1.9,1.9,0.3,52),M.dark); b.rotation.z=Math.PI/2; b.position.x=px; b.castShadow=true; alt.add(b); });
  const tb=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.68,1.6),M.dark); tb.position.set(0.2,1.9,0); alt.add(tb);
  const phc=[0xb1564a,0xb59440,0x5f7f9c];
  for(let i=0;i<3;i++){ const bu=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.14,0.55,16),M.insul); bu.position.set(-0.2+i*0.4,2.42,0); alt.add(bu);
    const cap=new THREE.Mesh(new THREE.SphereGeometry(0.12,14,14),new THREE.MeshStandardMaterial({color:phc[i],roughness:0.42,metalness:0.6,envMapIntensity:0.6})); cap.position.set(-0.2+i*0.4,2.72,0); alt.add(cap); }
  const afeet=new THREE.Mesh(new THREE.BoxGeometry(3.3,0.35,3.9),M.dark); afeet.position.y=-1.72; alt.add(afeet);
  // slip-ring end + brush gear (salient signal it's a synchronous machine)
  const sr=new THREE.Group();
  for(let i=0;i<2;i++){ const ring=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.62,0.18,28),M.brass); ring.rotation.z=Math.PI/2; ring.position.x=-2.05 - i*0.26; sr.add(ring); }
  alt.add(sr);
  alt.position.set(2.2,2.55,0); scene.add(alt);
  // shaft
  const shaftGrp=new THREE.Group();
  const sh=new THREE.Mesh(new THREE.CylinderGeometry(0.19,0.19,4.0,20),M.machined); sh.rotation.z=Math.PI/2; shaftGrp.add(sh);
  const cp=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,0.8,32),M.steel); cp.rotation.z=Math.PI/2; shaftGrp.add(cp);
  const rl=new THREE.Mesh(new THREE.BoxGeometry(0.82,0.02,0.12),M.stripe); rl.position.y=0.48; shaftGrp.add(rl);
  shaftGrp.position.set(-1.5,2.55,0); scene.add(shaftGrp);

  // inductive load bank (ZPF loading) — rack of reactor coils
  const bank=new THREE.Group();
  const bankFrame=new THREE.Mesh(new THREE.BoxGeometry(3.6,3.0,1.4),new THREE.MeshStandardMaterial({color:0x121728,roughness:0.6,metalness:0.4,envMapIntensity:0.4}));
  bankFrame.position.y=1.5; bankFrame.castShadow=true; bank.add(bankFrame);
  for(let c=0;c<3;c++){ for(let s=0;s<7;s++){ const coil=new THREE.Mesh(new THREE.TorusGeometry(0.34,0.06,8,26),M.copper); coil.position.set(-1.0+c*1.0, 0.6+s*0.36, 0.72); coil.rotation.x=Math.PI/2; bank.add(coil);} }
  const bankcap=new THREE.Mesh(new THREE.BoxGeometry(3.7,0.16,1.5),M.dark); bankcap.position.y=3.05; bank.add(bankcap);
  bank.position.set(7.4,0.2,-0.2); bank.rotation.y=-0.35; scene.add(bank);
  // cable alternator -> load bank
  const cc=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(2.4,5.3,0),new THREE.Vector3(5,4.2,0),new THREE.Vector3(7.2,3.2,-0.1)]),24,0.06,8,false),new THREE.MeshStandardMaterial({color:0x8a6a3a,roughness:0.5})); scene.add(cc);

  /* ================= wiring ================= */
  function setFill(el){ const p=(el.value-el.min)/(el.max-el.min)*100; el.style.setProperty('--fill',p+'%'); }
  const iSlider=$('iSlider'), pfSlider=$('pfSlider');
  function recompute(){
    const d=compute();
    // labels
    $('iVal').textContent=(Iar*S.loadPct/100).toFixed(1)+' A · '+S.loadPct+'%';
    const pf=Math.abs(Math.cos(S.phiDeg*DEG)), nat=S.phiDeg>0.5?'lag':S.phiDeg<-0.5?'lead':'unity';
    $('pfVal').textContent=pf.toFixed(2)+' '+nat;
    $('phLbl').textContent=pf.toFixed(2)+' '+nat;
    // results
    $('e1Out').textContent=d.E1.toFixed(0)+' V';
    $('if1Out').textContent=d.If1.toFixed(2)+' A';
    $('frOut').textContent=d.FR.toFixed(2)+' A';
    $('e0Out').textContent=d.E0.toFixed(0)+' V';
    const rg=d.reg; const cls=rg>15?'warn':rg<0?'ok':'';
    const ro=$('regOut'); ro.textContent=(rg>=0?'+':'')+rg.toFixed(1)+' %'; ro.className='rv '+(rg<0?'ok':rg>15?'warn':'indigo');
    const rp=$('regPill'); rp.textContent=(rg>=0?'+':'')+rg.toFixed(1)+' %'; rp.className='val '+(rg<0?'good':rg>15?'warn':'');
    $('regLbl').textContent=(rg>=0?'+':'')+rg.toFixed(0)+'%';
    drawOCC(); drawPhasor(); drawReg();
  }
  iSlider.addEventListener('input',()=>{ S.loadPct=+iSlider.value; setFill(iSlider); recompute(); });
  pfSlider.addEventListener('input',()=>{ S.phiDeg=+pfSlider.value; setFill(pfSlider); recompute(); });
  setFill(iSlider); setFill(pfSlider);
  function wireTg(id,key){ const e=$(id); e.addEventListener('click',()=>{ S[key]=!S[key]; e.classList.toggle('on',S[key]); recompute(); }); }
  wireTg('tgConstruct','showCon'); wireTg('tgAirgap','showAir');
  $('ptoggle').addEventListener('click',()=>$('side').classList.toggle('open'));

  // hint auto-hide
  const viewHint=$('viewHint'), hintDot=$('hintDot'); let hintDone=false;
  function stow(){ if(hintDone)return; hintDone=true; viewHint.classList.add('hidden'); hintDot.classList.add('show'); }
  const ht=setTimeout(stow,6000);
  ['pointerdown','wheel'].forEach(ev=>canvas.addEventListener(ev,()=>{clearTimeout(ht);stow();},{passive:true}));
  hintDot.addEventListener('mouseenter',()=>viewHint.classList.remove('hidden'));
  hintDot.addEventListener('mouseleave',()=>{ if(hintDone)viewHint.classList.add('hidden'); });

  recompute();

  /* ================= loop ================= */
  const clock=new THREE.Clock();
  function frame(){ requestAnimationFrame(frame); const dt=Math.min(clock.getDelta(),0.05);
    S.shaft+=6.0*dt; shaftGrp.rotation.x=S.shaft;
    renderer.render(scene,camera); }
  frame();
  const ld=$('loading'); ld.style.opacity='0'; setTimeout(()=>ld.remove(),520);
}
<\/script>
</body>
</html>
</script>

<script>
(function(){
  var EXP=['motor','alt','zpf'], built={};
  var tabs=document.querySelectorAll('.sb-tab');
  var loader=document.getElementById('stageLoader');
  // stored templates escape their inner closing-script tags as <\/script>; restore before mounting
  function unesc(t){ return t.replace(/<\\\/script>/g,'<\/script>'); }
  function mount(exp){
    var ifr=document.getElementById('ifr-'+exp);
    if(!built[exp]){
      loader.classList.add('show');
      ifr.addEventListener('load', function onl(){ loader.classList.remove('show'); ifr.removeEventListener('load', onl); });
      ifr.srcdoc = unesc(document.getElementById('tpl-'+exp).textContent);
      built[exp]=true;
      // safety: clear loader even if load doesn't fire
      setTimeout(function(){ loader.classList.remove('show'); }, 4000);
    }
    EXP.forEach(function(e){ document.getElementById('ifr-'+e).classList.toggle('active', e===exp); });
    tabs.forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-exp')===exp); });
  }
  tabs.forEach(function(t){ t.addEventListener('click', function(){ mount(t.getAttribute('data-exp')); }); });
  mount('motor');
})();
</script>
